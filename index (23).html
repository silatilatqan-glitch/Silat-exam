/* شاشة انتهاء الوقت مع polling تلقائي للتمديد */
function ExpiredWaitScreen({sub,onResume,onHome}){
  const[checking,setChecking]=useState(false);
  const[msg,setMsg]=useState("");

  // تحقق كل 30 ثانية هل مُدِّد الوقت
  useEffect(()=>{
    const poll=setInterval(async()=>{
      try{
        const r=await api("student_get_sub",{id:sub.id,studentId:sub.studentId});
        if(r.sub&&!isExpired(r.sub)){
          clearInterval(poll);
          setMsg("✅ تم التمديد! جارٍ فتح الاختبار...");
          setTimeout(()=>onResume(r.sub),1500);
        }
      }catch(e){}
    },30*1000);
    return()=>clearInterval(poll);
  },[]);

  const checkNow=async()=>{
    setChecking(true);setMsg("");
    try{
      const r=await api("student_get_sub",{id:sub.id,studentId:sub.studentId});
      if(r.sub&&!isExpired(r.sub)){
        setMsg("✅ تم التمديد! جارٍ فتح الاختبار...");
        setTimeout(()=>onResume(r.sub),1500);
      } else {
        setMsg("⏳ لم يتم التمديد بعد — انتظر المدرب");
      }
    }catch(e){setMsg("تعذّر التحقق");}
    setChecking(false);
  };

  return(
    <div dir="rtl" style={{fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#F7F4EC",padding:"1rem"}}>
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:16,padding:"2.5rem",maxWidth:460,width:"100%",textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:52,marginBottom:14}}>⏰</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8,color:"#d97706"}}>انتهى وقت الاختبار</div>
        <div style={{background:"#d1fae5",border:"0.5px solid #a7f3d0",borderRadius:8,padding:"8px 14px",marginBottom:14,fontSize:13,color:"#065f46",fontWeight:600}}>
          ✅ إجاباتك محفوظة بالكامل ولم تُحذف
        </div>
        <div style={{fontSize:14,color:"#6b7280",lineHeight:1.9,marginBottom:"1.5rem"}}>
          تواصل مع المدرب لتمديد الوقت.<br/>
          <strong>سيُفتح الاختبار تلقائياً بعد التمديد</strong> دون الحاجة لإعادة الدخول.
        </div>
        <div style={{background:"#f8fafc",border:"0.5px solid #e5e7eb",borderRadius:10,padding:"1rem",marginBottom:"1.5rem",textAlign:"right",fontSize:13}}>
          <div style={{marginBottom:4}}><b>الاسم:</b> {sub.studentName}</div>
          <div style={{marginBottom:4}}><b>الدورة:</b> {sub.courseTitle}</div>
          <div style={{color:"#9ca3af",fontSize:12}}>رقم الاختبار: {serial(sub.id)}</div>
        </div>
        {msg&&<div style={{background:msg.includes("✅")?"#d1fae5":"#fef3c7",borderRadius:8,padding:"8px 14px",marginBottom:12,fontSize:13,fontWeight:600,color:msg.includes("✅")?"#065f46":"#92400e"}}>{msg}</div>}
        <button onClick={checkNow} disabled={checking} style={{width:"100%",padding:"11px",background:"#1B3059",color:"white",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:600,marginBottom:8}}>
          {checking?"⏳ جارٍ التحقق...":"🔄 تحقق من التمديد الآن"}
        </button>
        <button onClick={onHome} style={{width:"100%",padding:"8px",background:"none",border:"none",color:"#9ca3af",fontSize:13,cursor:"pointer"}}>العودة للرئيسية</button>
        <div style={{fontSize:11,color:"#d1d5db",marginTop:8}}>يتحقق تلقائياً كل 30 ثانية</div>
      </div>
    </div>
  );
}

function App(){
  const[subs,setSubs]=useState([]);
  const[courses,setCourses]=useState(COURSES);
  const[loading,setLoading]=useState(true);
  const[screen,setScreen]=useState("home");
  const[sId,setSId]=useState("");
  const[sName,setSName]=useState("");
  const[sBirthdate,setSBirthdate]=useState("");
  const[sOrderNum,setSOrderNum]=useState("");
  const[sPhone,setSPhone]=useState("");
  const[reentryRequest,setReentryRequest]=useState(null);
  const[activeSub,setActiveSub]=useState(null);
  const[gradingSub,setGradingSub]=useState(null);
  const[certSub,setCertSub]=useState(null);
  const[trainerAuth,setTrainerAuth]=useState(false);
  const[tPass,setTPass]=useState("");
  const[tBusy,setTBusy]=useState(false);
  const[err,setErr]=useState("");
  const[fieldErr,setFieldErr]=useState({}); // رسائل خطأ لكل حقل في تسجيل الدخول

  /* 🔐 دخول المدرب — التحقق في الخادم، ويعود برمز جلسة موقّع */
  const doTrainerLogin=async()=>{
    if(!tPass){setErr("أدخل كلمة المرور");return;}
    setTBusy(true);setErr("");
    try{
      const r=await api("trainer_login",{password:tPass});
      if(r.ok&&r.token){
        TRAINER_TOKEN=r.token;
        // نسخة المدرب الكاملة من الدورات: بالمعايير ورموز الدخول
        try{
          const tc=await api("trainer_courses");
          DEFAULT_CRITERIA_SRV=tc.defaultCriteria||{};
          TRAINER_CODES=tc.codes||{};
          setCourses(mergeCourses(tc.courses,tc.deleted));
        }catch(e){console.error("trainer_courses:",e);}
        setTrainerAuth(true);setScreen("dashboard");
      }else setErr("كلمة المرور خاطئة");
    }catch(e){setErr(e.status===401?"كلمة المرور خاطئة":"تعذر الاتصال بالخادم — حاول مجدداً");}
    setTBusy(false);
  };
  const[selectedCourse,setSelectedCourse]=useState(null);
  const[courseCode,setCourseCode]=useState("");
  const[codeErr,setCodeErr]=useState("");
  const[codeBusy,setCodeBusy]=useState(false);

  /* تحميل الإعدادات العامة والدورات عند البداية — عبر الخزنة (بلا معايير ولا رموز) */
  useEffect(()=>{
    (async()=>{
      // ① الإعدادات العامة (ساعات الاختبار)
      try{
        const cfg=await api("get_public_config");
        if(cfg.examHours)EXAM_HOURS=parseInt(cfg.examHours);
      }catch(e){console.error("config:",e);}

      // ② الدورات للطالب — الخادم يحذف معايير التصحيح قبل الإرسال
      try{
        const r=await api("get_courses");
        setCourses(mergeCourses(r.courses,r.deleted));
      }catch(e){console.error("courses:",e);setCourses(COURSES);}

      /* ═══ استعادة جلسة الطالب تلقائياً عند تحديث الصفحة ═══ */
      try{
        const savedSession=sessionStorage.getItem("itqan_session");
        if(savedSession){
          const session=JSON.parse(savedSession);
          if(session.subId&&session.studentId){
            // أعد تحميل بيانات الطالب من Supabase
            const myData=await dbLoad(session.studentId);
            const currentSub=myData.find(s=>s.id===session.subId&&s.status==="in_progress");
            if(currentSub){
              // استعد الجلسة — إن كان الوقت جارياً افتح الاختبار، وإن انتهى افتح شاشة انتظار التمديد (تتحقق تلقائياً)
              setSubs(myData);
              setSId(session.studentId||"");
              setSName(session.studentName||"");
              setActiveSub(currentSub);
              setLoading(false);
              setScreen(isExpired(currentSub)?"expired-wait":"exam");
              return;
            }
          }
          // الجلسة منتهية أو غير صالحة — امسحها
          sessionStorage.removeItem("itqan_session");
        }
      }catch(e){}

      setLoading(false);
    })();
  },[]);

  const inp={width:"100%",padding:"11px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,fontSize:15,boxSizing:"border-box",outline:"none",fontFamily:"inherit"};
  const base={direction:"rtl",fontFamily:"inherit",minHeight:"100vh",background:"#F7F4EC"};

  /* شاشة التحميل */
  if(loading) return(
    <div style={{...base,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <img src={LOGO_FULL} alt="" style={{width:150,display:"block",margin:"0 auto 18px"}}/>
        <div style={{fontSize:16,color:"#1B3059",fontWeight:600}}>⏳ جارٍ تحميل البيانات...</div>
        <div style={{fontSize:13,color:"#9ca3af",marginTop:8}}>يتصل بقاعدة البيانات</div>
      </div>
    </div>
  );

  const doLogin=async()=>{
    // تحقق لكل حقل على حدة — رسالة الخطأ تظهر تحت الحقل نفسه
    const fe={};
    if(!sId.trim())fe.sId="يرجى إدخال رقم الهوية الوطنية";
    else if(!/^[12]\d{9}$/.test(sId.trim()))fe.sId="رقم الهوية يجب أن يكون 10 أرقام ويبدأ بـ 1 أو 2";
    if(!sName.trim())fe.sName="يرجى إدخال الاسم الثلاثي بالإنجليزية";
    else if(!/^[a-zA-Z\s]+$/.test(sName.trim()))fe.sName="يجب كتابة الاسم بالإنجليزية فقط (Latin letters)";
    else if(sName.trim().split(/\s+/).length<3)fe.sName="يرجى إدخال الاسم الثلاثي كاملاً بالإنجليزية";
    if(!sBirthdate)fe.sBirthdate="يرجى اختيار تاريخ الميلاد";
    if(!sPhone.trim()||!/^[0-9+]{9,15}$/.test(sPhone.trim()))fe.sPhone="يرجى إدخال رقم جوال صحيح";
    if(!sOrderNum.trim())fe.sOrderNum="يرجى إدخال رقم الطلب الموجود في سلة";
    setFieldErr(fe);
    if(Object.keys(fe).length>0)return;
    setErr("");
    const myData=await dbLoad(sId.trim());
    setSubs(myData);

    // طلب إعادة دخول معلّق
    const pending=myData.find(s=>s.studentId===sId.trim()&&s.status==="reentry_pending");
    if(pending){setScreen("reentry-pending");return;}

    // موافقة على إعادة الدخول
    const approved=myData.find(s=>s.studentId===sId.trim()&&s.status==="reentry_approved");
    if(approved){await dbUpsert({...approved,status:"reentry_used"});}

    // تحقق هل يوجد نتيجة جديدة للطالب
    const newResults=myData.filter(s=>s.studentId===sId.trim()&&["pass","fail"].includes(s.status)&&!s.resultSeen);
    if(newResults.length>0){
      // علّم النتائج كمقروءة حتى لا تُعاد الإحالة لهذه الصفحة في كل دخول قادم
      const seenData=myData.map(s=>newResults.some(n=>n.id===s.id)?{...s,resultSeen:true}:s);
      newResults.forEach(n=>{dbUpsert({...n,resultSeen:true});});
      // أذهبه لصفحة نتائجه مع إشعار
      setSubs(seenData);
      setScreen("my-results");
      return;
    }

    // دائماً اذهب لصفحة الدورات — الطالب يختار ما يريد
    setScreen("courses");
  };

  const startExam=async(course,scenarioId)=>{
    const sid=sId.trim();
    // هل يوجد اختبار جارٍ في هذه الدورة؟
    const activeInCourse=subs.find(s=>s.studentId===sid&&s.courseId===course.id&&s.status==="in_progress"&&!isExpired(s));
    if(activeInCourse){setActiveSub(activeInCourse);setScreen("exam");return;}

    // هل يوجد اختبار منتهي الوقت في هذه الدورة؟
    const expiredInCourse=subs.find(s=>s.studentId===sid&&s.courseId===course.id&&s.status==="in_progress"&&isExpired(s));
    if(expiredInCourse){setActiveSub(expiredInCourse);setScreen("expired-wait");return;}

    // تحقق هل اختبر هذه الدورة من قبل وأنهاها
    const prevInCourse=subs.find(s=>s.studentId===sid&&s.courseId===course.id&&["submitted","grading","pass","fail"].includes(s.status));
    // 🔓 موافقة المدرب على إعادة الدخول تفتح محاولة جديدة واحدة — تُستهلك عند البدء الفعلي
    const reentryPermit=subs.find(s=>s.studentId===sid&&s.courseId===course.id&&["reentry_approved","reentry_used"].includes(s.status));
    if(prevInCourse&&!reentryPermit){
      setReentryRequest(prevInCourse);
      setScreen("reentry-request");
      return;
    }
    if(prevInCourse&&reentryPermit){
      const consumed={...reentryPermit,status:"reentry_consumed",consumedAt:new Date().toISOString()};
      await dbUpsert(consumed);
      setSubs(prev=>prev.map(s=>s.id===consumed.id?consumed:s));
    }
    // 🛟 محاولة جارية فقدت سجلها النشط (انقطاع أثناء التنقل بين السيناريوهات): أكملها بنفس نافذة الوقت بدل فتح نافذة جديدة
    const completedInCourse=prevInCourse?[]:subs.filter(s=>s.studentId===sid&&s.courseId===course.id&&s.status==="scenario_completed");
    const sameScenarioSaved=completedInCourse.find(s=>s.scenarioId===scenarioId);
    if(sameScenarioSaved){
      const reopened={...sameScenarioSaved,status:"in_progress"};
      await dbUpsert(reopened);
      sessionStorage.setItem("itqan_session",JSON.stringify({subId:reopened.id,studentId:sid,studentName:sName.trim()}));
      setSubs(prev=>prev.map(s=>s.id===reopened.id?reopened:s));
      setActiveSub(reopened);
      setScreen(isExpired(reopened)?"expired-wait":"exam");
      return;
    }
    const scenario=course.scenarios.find(s=>s.id===scenarioId);
    // ورث نافذة الوقت من سيناريوهات المحاولة نفسها إن وُجدت
    const windowRef=completedInCourse.length>0?completedInCourse[completedInCourse.length-1]:null;
    const sub={id:uid(),studentId:sid,studentName:sName.trim(),studentBirthdate:sBirthdate,studentOrderNum:sOrderNum.trim(),studentPhone:sPhone.trim(),courseId:course.id,courseTitle:course.title,scenarioId,scenarioTitle:scenario.title,answers:{},scores:{},totalScore:undefined,maxScore:scenario.tasks.reduce((a,t)=>a+t.marks,0),status:"in_progress",extensionHours:windowRef?(windowRef.extensionHours||0):0,examHours:windowRef&&windowRef.examHours?windowRef.examHours:EXAM_HOURS,startTime:windowRef?windowRef.startTime:new Date().toISOString(),submittedAt:null,reviewedAt:null};
    await dbUpsert(sub);
    // احفظ الجلسة لاستعادتها عند تحديث الصفحة
    sessionStorage.setItem("itqan_session",JSON.stringify({subId:sub.id,studentId:sid,studentName:sName.trim()}));
    setSubs(prev=>[...prev,sub]);setActiveSub(sub);
    setScreen(isExpired(sub)?"expired-wait":"exam");
  };

  const onSubmit=async updatedSub=>{
    // جمع إجابات سيناريوهات المحاولة الحالية فقط (نفس نافذة الوقت startTime) — لا تُدمج بقايا محاولات قديمة
    let pool=subs;
    try{const fresh=await dbLoad(updatedSub.studentId);if(fresh&&fresh.length)pool=fresh;}catch(e){}
    const byScenario={};
    pool.filter(s=>
      s.studentId===updatedSub.studentId&&
      s.courseId===updatedSub.courseId&&
      s.status==="scenario_completed"&&
      s.startTime===updatedSub.startTime&&
      s.id!==updatedSub.id&&
      s.scenarioId!==updatedSub.scenarioId
    ).forEach(s=>{byScenario[s.scenarioId]=s;}); // سجل واحد لكل سيناريو
    const allScenarioSubs=Object.values(byScenario);

    // دمج جميع الإجابات في سجل واحد — إجابات السيناريو الحالي لها الأولوية
    const mergedAnswers={};
    allScenarioSubs.forEach(s=>Object.assign(mergedAnswers,s.answers||{}));
    Object.assign(mergedAnswers,updatedSub.answers||{});

    // حساب مجموع الدرجات من جميع السيناريوهات
    const course=(courses||COURSES).find(c=>c.id===updatedSub.courseId);
    const totalMaxScore=allScenarioSubs.reduce((sum,s)=>sum+(s.maxScore||0),0)+(updatedSub.maxScore||0);
    // قائمة بجميع سيناريوهات المحاولة — مرتّبة بترتيبها داخل الدورة
    const idSet=new Set([...allScenarioSubs.map(s=>s.scenarioId),updatedSub.scenarioId]);
    const courseOrder=(course?.scenarios||[]).map(s=>s.id).filter(id=>idSet.has(id));
    const completedScenarioIds=[...courseOrder,...[...idSet].filter(id=>!courseOrder.includes(id))];
    // عنوان يعكس كل السيناريوهات المقدّمة
    const scTitles=completedScenarioIds.map(id=>course?.scenarios.find(x=>x.id===id)?.title).filter(Boolean);
    const combinedTitle=scTitles.length>1?scTitles.map(t=>String(t).split("—")[0].trim()).join(" + "):updatedSub.scenarioTitle;

    const final={
      ...updatedSub,
      answers:mergedAnswers,
      maxScore:totalMaxScore||updatedSub.maxScore,
      scenarioTitle:combinedTitle||updatedSub.scenarioTitle,
      status:"submitted",
      submittedAt:new Date().toISOString(),
      completedScenarioIds, // قائمة بجميع السيناريوهات المكتملة
      isMultiScenario:completedScenarioIds.length>1
    };
    await dbUpsert(final);
    // 🔔 إشعار للمدرب بالاختبار الجديد
    await addNotification("new_submission",{
      studentName:updatedSub.studentName,
      studentId:updatedSub.studentId,
      courseTitle:updatedSub.courseTitle,
      time:new Date().toISOString()
    });
    sessionStorage.removeItem("itqan_session");
    setSubs(prev=>prev.map(s=>s.id===final.id?final:s));
    setActiveSub(final);
    setScreen("pending");
  };

  const onSaveGrade=async(subId,scores,total,maxScore,status)=>{
    const updated={...subs.find(s=>s.id===subId),scores,totalScore:total,maxScore,status,reviewedAt:new Date().toISOString()};
    // إصدار شهادة تلقائي عند النجاح
    if(status==="pass"){
      const course=(courses||COURSES).find(c=>c.id===updated.courseId);
      const certId=await issueCertificate(updated,course||{});
      if(certId){
        updated.certId=certId;
      } else {
        // ⚠️ تنبيه المدرب بفشل إصدار الشهادة
        alert("⚠️ تحذير: تم اعتماد الطالب كناجح لكن فشل إصدار الشهادة في Firebase.\nيرجى التحقق من الاتصال وإعادة المحاولة أو إصدار الشهادة يدوياً.");
      }
    }
    await dbUpsert(updated);
    setSubs(prev=>prev.map(s=>s.id===subId?updated:s));setGradingSub(null);setScreen("dashboard");
  };

  const onNextScenario=(newSub)=>{
    // حدّث الجلسة للسيناريو الجديد
    sessionStorage.setItem("itqan_session",JSON.stringify({subId:newSub.id,studentId:newSub.studentId,studentName:newSub.studentName}));
    setActiveSub(newSub);
    setScreen("exam");
  };
  const refreshSubs=async()=>{const d=await dbLoad();setSubs(d);};
  const loadAllSubs=async()=>{const d=await dbLoad();setSubs(d);};

  /* Screens */
  if(screen==="certificate"&&certSub) return <Certificate sub={certSub} courses={courses} onBack={()=>setScreen("dashboard")}/>;
  if(screen==="grading"&&gradingSub) return <GradingView sub={gradingSub} courses={courses} onSave={onSaveGrade} onBack={()=>{setGradingSub(null);setScreen("dashboard");}}/>;
  if(screen==="manage-courses"&&trainerAuth) return <CourseBuilder courses={courses} onSave={updated=>{setCourses(updated);}} onBack={()=>setScreen("dashboard")}/>;
  if(screen==="dashboard"&&trainerAuth) return <Dashboard subs={subs} setSubs={setSubs} courses={courses} onGrade={s=>{setGradingSub(s);setScreen("grading");}} onCert={s=>{setCertSub(s);setScreen("certificate");}} onLogout={()=>{TRAINER_TOKEN=null;TRAINER_CODES={};DEFAULT_CRITERIA_SRV={};setTrainerAuth(false);setScreen("home");setSubs([]);}} onRefresh={refreshSubs} onManageCourses={()=>setScreen("manage-courses")} onLoad={loadAllSubs}/>;
  if(screen==="exam"&&activeSub) return <ExamView key={activeSub.id} sub={activeSub} setSubs={setSubs} subs={subs} courses={courses} onSubmit={onSubmit} onNextScenario={onNextScenario} setActiveSub={setActiveSub}/>;

  /* شاشة انتهاء الوقت — الإجابات محفوظة */
  if(screen==="expired-wait"&&activeSub) return(
    <ExpiredWaitScreen sub={activeSub} onResume={(sub)=>{setActiveSub(sub);setScreen("exam");}} onHome={()=>{setScreen("home");setSId("");setSName("");setSBirthdate("");setSOrderNum("");setSPhone("");setActiveSub(null);}}/>
  );

  /* شاشة طلب إعادة الدخول */
  if(screen==="reentry-request") return(
    <div style={{...base,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:16,padding:"2.5rem",maxWidth:460,width:"100%",textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:52,marginBottom:14}}>🔄</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>يوجد لديك اختبار سابق</div>
        <div style={{background:"#f8fafc",border:"0.5px solid #e5e7eb",borderRadius:10,padding:"1rem",marginBottom:"1.5rem",textAlign:"right"}}>
          <div style={{fontSize:14,marginBottom:4}}><b>الدورة:</b> {reentryRequest?.courseTitle}</div>
          <div style={{fontSize:14,marginBottom:4}}><b>الحالة:</b> {reentryRequest?.status==="pass"?"ناجح ✓":reentryRequest?.status==="fail"?"راسب ✗":"مُرسَل للمدرب"}</div>
          <div style={{fontSize:12,color:"#9ca3af"}}>تاريخ التقديم: {fmtFull(reentryRequest?.submittedAt)}</div>
        </div>
        <div style={{fontSize:14,color:"#6b7280",marginBottom:"1.5rem",lineHeight:1.8}}>لإعادة الاختبار يجب الحصول على موافقة المدرب أولاً.</div>
        <button onClick={async()=>{
          const req={id:uid(),studentId:sId.trim(),studentName:sName.trim(),studentPhone:sPhone.trim(),studentBirthdate:sBirthdate,studentOrderNum:sOrderNum.trim(),courseId:reentryRequest?.courseId,courseTitle:reentryRequest?.courseTitle,status:"reentry_pending",requestedAt:new Date().toISOString(),previousSubId:reentryRequest?.id};
          await dbUpsert(req);
          // 🔔 إشعار للمدرب بطلب إعادة الدخول
          await addNotification("reentry_request",{
            studentName:sName.trim(),studentId:sId.trim(),
            courseTitle:reentryRequest?.courseTitle,time:new Date().toISOString()
          });
          setScreen("reentry-pending");
        }} style={{width:"100%",padding:"11px",background:"#1B3059",color:"white",border:"none",borderRadius:10,cursor:"pointer",fontSize:15,fontWeight:600,marginBottom:8}}>إرسال طلب إعادة الدخول للمدرب</button>
        <button onClick={()=>{setScreen("home");setSId("");setSName("");setSBirthdate("");setSOrderNum("");setSPhone("");}} style={{width:"100%",padding:"8px",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>إلغاء</button>
      </div>
    </div>
  );

  /* شاشة انتظار موافقة المدرب */
  if(screen==="reentry-pending") return(
    <div style={{...base,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:16,padding:"2.5rem",maxWidth:460,width:"100%",textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:52,marginBottom:14}}>⏳</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>طلبك قيد المراجعة</div>
        <div style={{fontSize:14,color:"#6b7280",lineHeight:1.9,marginBottom:"1.5rem"}}>
          تم إرسال طلب إعادة الدخول للمدرب.<br/>
          سيتم إشعارك عند الموافقة — ادخل من جديد للتحقق.
        </div>
        <button onClick={()=>{setScreen("home");setSId("");setSName("");setSBirthdate("");setSOrderNum("");setSPhone("");}} style={{width:"100%",padding:"11px",background:"#1B3059",color:"white",border:"none",borderRadius:10,cursor:"pointer",fontSize:15,fontWeight:600}}>العودة للرئيسية</button>
      </div>
    </div>
  );

  /* Trainer login */
  if(screen==="trainer-login") return(
    <div style={{...base,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:16,padding:"2rem",width:360,maxWidth:"100%",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
          <img src={LOGO_MARK} alt="" style={{height:60,display:"block",margin:"0 auto 10px"}}/>
          <div style={{fontSize:18,fontWeight:700,color:"#101F3C"}}>🔐 دخول المدرب</div>
          <div style={{fontSize:12,color:"#9ca3af",marginTop:4}}>{ORG}</div>
        </div>
        <input value={tPass} onChange={e=>setTPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!tBusy&&doTrainerLogin()} type="password" placeholder="كلمة مرور المدرب" style={{...inp,textAlign:"center",letterSpacing:4,marginBottom:10}}/>
        {err&&<div style={{color:"#dc2626",fontSize:13,marginBottom:8,textAlign:"center"}}>{err}</div>}
        <button onClick={doTrainerLogin} disabled={tBusy} style={{width:"100%",padding:"11px",background:"#1B3059",color:"white",border:"none",borderRadius:8,fontSize:15,cursor:"pointer",fontWeight:600,marginBottom:8,opacity:tBusy?0.7:1}}>{tBusy?"⏳ جارٍ التحقق...":"دخول"}</button>
        <button onClick={()=>{setScreen("home");setErr("");}} style={{width:"100%",padding:"8px",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>← رجوع</button>
      </div>
    </div>
  );

  /* Pending */
  if(screen==="pending") return(
    <div style={{...base,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:16,padding:"2.5rem",maxWidth:480,width:"100%",textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:56,marginBottom:16}}>✅</div>
        <div style={{fontSize:22,fontWeight:700,marginBottom:8}}>تم إرسال الاختبار بنجاح</div>
        <div style={{fontSize:14,color:"#6b7280",lineHeight:1.9,marginBottom:"1.5rem"}}>سيراجع المدرب إجاباتك التحليلية ويُعلن النتيجة قريباً.<br/>لن تظهر لك الدرجة مباشرةً — يُرجى انتظار إشعار المدرب.</div>
        <div style={{background:"#EEF2F8",border:"0.5px solid #C9D5EA",borderRadius:10,padding:"1rem",marginBottom:"1.5rem",textAlign:"right"}}>
          <div style={{fontSize:14,marginBottom:4}}><b>الاسم:</b> {activeSub?.studentName}</div>
          <div style={{fontSize:14,marginBottom:4}}><b>رقم الهوية:</b> {activeSub?.studentId}</div>
          <div style={{fontSize:14,marginBottom:4}}><b>تاريخ الميلاد:</b> {activeSub?.studentBirthdate}</div>
          <div style={{fontSize:14,marginBottom:4}}><b>رقم الجوال:</b> {activeSub?.studentPhone}</div>
          <div style={{fontSize:14,marginBottom:4}}><b>رقم الطلب:</b> {activeSub?.studentOrderNum}</div>
          <div style={{fontSize:14,marginBottom:4}}><b>الدورة:</b> {activeSub?.courseTitle}</div>
          <div style={{fontSize:14,marginBottom:4}}><b>السيناريو:</b> {activeSub?.scenarioTitle}</div>
          <div style={{fontSize:12,color:"#9ca3af",marginTop:6}}>رقم الاختبار: {activeSub&&serial(activeSub.id)}</div>
        </div>
        {activeSub?.status==="submitted"&&!activeSub?.editRequest&&(
          <button onClick={async()=>{
            const upd={...activeSub,editRequest:{status:"pending",at:new Date().toISOString()}};
            await dbUpsert(upd);
            await addNotification("edit_request",{studentName:upd.studentName,studentId:upd.studentId,courseTitle:upd.courseTitle,time:new Date().toISOString()});
            setSubs(prev=>prev.map(s=>s.id===upd.id?upd:s));
            setActiveSub(upd);
          }} style={{width:"100%",padding:"10px",background:"white",border:"1px solid #d97706",color:"#b45309",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:600,marginBottom:8}}>✏️ طلب فتح الاختبار للتعديل (بموافقة المدرب)</button>
        )}
        {activeSub?.editRequest?.status==="pending"&&<div style={{background:"#fef3c7",borderRadius:8,padding:"8px 12px",marginBottom:8,fontSize:13,color:"#92400e",fontWeight:600}}>⏳ طلب التعديل مُرسل — بانتظار موافقة المدرب. ادخل لاحقاً من جديد وستجد الاختبار مفتوحاً إذا وافق.</div>}
        <button onClick={()=>{setScreen("home");setSId("");setSName("");setSBirthdate("");setSOrderNum("");setSPhone("");setActiveSub(null);}} style={{width:"100%",padding:"11px",background:"#1B3059",color:"white",border:"none",borderRadius:10,cursor:"pointer",fontSize:15,fontWeight:600}}>العودة للرئيسية</button>
      </div>
    </div>
  );

  /* Course code entry — التحقق يتم في الخادم، الرمز الصحيح غير موجود في المتصفح */
  const verifyCourseCode=async()=>{
    if(!courseCode){setCodeErr("أدخل رمز الدخول");return;}
    setCodeBusy(true);setCodeErr("");
    try{
      const r=await api("verify_code",{courseId:selectedCourse?.id,code:courseCode});
      if(r.reason==="no_code")setCodeErr("لم يُحدَّد رمز دخول لهذه الدورة بعد — يحدده المدرب من «إدارة الدورات» ثم أعد المحاولة");
      else if(r.ok){setCodeErr("");setScreen("scenario-select");}
      else setCodeErr("رمز الدخول غير صحيح");
    }catch(e){setCodeErr("تعذر الاتصال بالخادم — حاول مجدداً");}
    setCodeBusy(false);
  };
  if(screen==="course-code"&&selectedCourse) return(
    <div style={{...base,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:16,padding:"2rem",width:400,maxWidth:"100%",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
          <div style={{fontSize:40,marginBottom:8}}>{selectedCourse.icon}</div>
          <div style={{fontSize:17,fontWeight:700}}>{selectedCourse.title}</div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:4}}>أدخل رمز الدخول للمتابعة</div>
        </div>
        <input value={courseCode} onChange={e=>setCourseCode(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&verifyCourseCode()}
          placeholder="أدخل الرمز هنا..." style={{...inp,textAlign:"center",letterSpacing:3,fontWeight:700,fontSize:17,marginBottom:10,background:"#f8fafc"}}/>
        {codeErr&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10,textAlign:"center"}}>{codeErr}</div>}
        <button onClick={verifyCourseCode} disabled={codeBusy} style={{width:"100%",padding:"11px",background:"#1B3059",color:"white",border:"none",borderRadius:8,fontSize:15,cursor:"pointer",fontWeight:600,marginBottom:8,opacity:codeBusy?0.7:1}}>{codeBusy?"⏳ جارٍ التحقق...":"تحقق من الرمز ←"}</button>
        <button onClick={()=>{setScreen("courses");setCourseCode("");setCodeErr("");}} style={{width:"100%",padding:"8px",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>← تغيير الدورة</button>
      </div>
    </div>
  );

  /* Scenario select */
  if(screen==="scenario-select"&&selectedCourse) return(
    <div style={{...base,padding:"1rem"}}>
      <div style={{maxWidth:800,margin:"0 auto"}}>
        <div style={{marginBottom:16}}>
          <button onClick={()=>{setScreen("courses");setCourseCode("");}} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,marginBottom:10}}>← تغيير الدورة</button>
          <div style={{fontSize:18,fontWeight:700}}>{selectedCourse.icon} {selectedCourse.title}</div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:2}}>مرحباً {sName} — اختر السيناريو الذي تريد اختباره</div>
        </div>
        {selectedCourse.scenarios.map(sc=>(
          <div key={sc.id} style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:14,padding:"1.5rem",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
            <div style={{fontSize:16,fontWeight:700,marginBottom:6,color:"#111827"}}>{sc.title}</div>
            <div style={{background:"#fffbeb",border:"0.5px solid #fde68a",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:13,color:"#92400e"}}>
              <strong>دورك:</strong> {sc.role}
            </div>
            <div style={{fontSize:13,color:"#374151",lineHeight:1.8,marginBottom:14,padding:"10px 12px",background:"#f8fafc",borderRadius:8,borderRight:"3px solid #1B3059"}}>{sc.context.substring(0,220)}...</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",gap:12}}>
                <span style={{fontSize:12,color:"#9ca3af"}}>📝 {sc.tasks.length} مهام تحليلية</span>
                <span style={{fontSize:12,color:"#9ca3af"}}>🎯 {sc.tasks.reduce((a,t)=>a+t.marks,0)} درجة</span>
                <span style={{fontSize:12,color:"#9ca3af"}}>⏱ {EXAM_HOURS} ساعة</span>
              </div>
              {(()=>{
                const active=subs.find(s=>s.studentId===sId&&s.scenarioId===sc.id&&s.status==="in_progress"&&!isExpired(s));
                const expired=subs.find(s=>s.studentId===sId&&s.courseId===selectedCourse.id&&s.status==="in_progress"&&isExpired(s));
                return active
                  ?<button onClick={()=>{setActiveSub(active);setScreen("exam");}} style={{padding:"9px 22px",border:"none",borderRadius:8,background:"#d97706",color:"white",cursor:"pointer",fontSize:14,fontWeight:700}}>← إكمال الاختبار</button>
                  :expired
                  ?<button onClick={()=>{setActiveSub(expired);setScreen("expired-wait");}} style={{padding:"9px 22px",border:"none",borderRadius:8,background:"#dc2626",color:"white",cursor:"pointer",fontSize:14,fontWeight:700}}>⏰ انتهى الوقت — طلب تمديد</button>
                  :<button onClick={()=>startExam(selectedCourse,sc.id)} style={{padding:"9px 22px",border:"none",borderRadius:8,background:"#1B3059",color:"white",cursor:"pointer",fontSize:14,fontWeight:700}}>بدء هذا السيناريو ←</button>;
              })()}
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  /* Courses */
  /* صفحة نتائج الطالب السابقة */
  if(screen==="my-results") return(
    <div style={{...base,padding:"1rem"}}>
      <div style={{maxWidth:800,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <button onClick={()=>setScreen("courses")} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13}}>← رجوع</button>
          <div>
            <div style={{fontSize:18,fontWeight:700}}>نتائجي السابقة</div>
            <div style={{fontSize:13,color:"#6b7280"}}>{sName}</div>
          </div>
        </div>
        {subs.filter(s=>s.studentId===sId&&["submitted","grading","pass","fail"].includes(s.status)).length===0
          ?<div style={{background:"white",borderRadius:12,padding:"3rem",textAlign:"center",color:"#9ca3af"}}>لا توجد اختبارات سابقة</div>
          :subs.filter(s=>s.studentId===sId&&["submitted","grading","pass","fail"].includes(s.status)).map(s=>(
            <div key={s.id} style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,padding:"1.25rem",marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:15}}>{s.courseTitle}</div>
                  <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{s.scenarioTitle}</div>
                  <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{fmtFull(s.submittedAt)}</div>
                </div>
                <div style={{textAlign:"center"}}>
                  {s.status==="pass"&&<div style={{background:"#d1fae5",color:"#065f46",borderRadius:10,padding:"6px 14px",fontWeight:700,fontSize:14}}>ناجح ✓<br/><span style={{fontSize:12}}>{s.totalScore}/{s.maxScore}</span></div>}
                  {s.status==="fail"&&<div style={{background:"#fee2e2",color:"#991b1b",borderRadius:10,padding:"6px 14px",fontWeight:700,fontSize:14}}>راسب ✗<br/><span style={{fontSize:12}}>{s.totalScore}/{s.maxScore}</span></div>}
                  {["submitted","grading"].includes(s.status)&&<div style={{background:"#fef3c7",color:"#92400e",borderRadius:10,padding:"6px 14px",fontWeight:600,fontSize:13}}>⏳ انتظار النتيجة</div>}
                </div>
              </div>
              {s.status==="pass"&&s.certId&&<div style={{marginTop:8,fontSize:12,color:"#1B3059",background:"#EEF2F8",borderRadius:6,padding:"6px 10px"}}>🏅 رقم الشهادة: <strong>{s.certId}</strong></div>}
              {s.status==="submitted"&&!s.editRequest&&<button onClick={async()=>{
                const upd={...s,editRequest:{status:"pending",at:new Date().toISOString()}};
                await dbUpsert(upd);
                await addNotification("edit_request",{studentName:upd.studentName,studentId:upd.studentId,courseTitle:upd.courseTitle,time:new Date().toISOString()});
                setSubs(prev=>prev.map(x=>x.id===upd.id?upd:x));
              }} style={{marginTop:8,width:"100%",padding:"8px",background:"white",border:"1px solid #d97706",color:"#b45309",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>✏️ طلب فتح الاختبار للتعديل</button>}
              {s.status==="submitted"&&s.editRequest?.status==="pending"&&<div style={{marginTop:8,fontSize:12,color:"#92400e",background:"#fef3c7",borderRadius:6,padding:"6px 10px",textAlign:"center",fontWeight:600}}>⏳ طلب التعديل بانتظار موافقة المدرب</div>}
              {s.status==="submitted"&&s.editRequest?.status==="rejected"&&<div style={{marginTop:8,fontSize:12,color:"#991b1b",background:"#fee2e2",borderRadius:6,padding:"6px 10px",textAlign:"center"}}>✗ تم رفض طلب التعديل — الاختبار مُرسَل للتصحيح</div>}
            </div>
          ))
        }
      </div>
    </div>
  );

  if(screen==="courses") return(
    <div style={{...base,padding:"1rem"}}>
      <div style={{maxWidth:800,margin:"0 auto"}}>
        <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:18,fontWeight:700}}>اختر الدورة</div>
            <div style={{fontSize:13,color:"#6b7280"}}>مرحباً {sName} — كل دورة تتطلب رمز دخول خاص</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setScreen("my-results")} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13}}>📋 نتائجي</button>
            <button onClick={()=>setScreen("home")} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,color:"#6b7280"}}>← رجوع</button>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:14}}>
          {courses.map(c=>(
            <button key={c.id} onClick={()=>{setSelectedCourse(c);setCourseCode("");setCodeErr("");setScreen("course-code");}} style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:14,padding:"1.5rem",textAlign:"right",cursor:"pointer",transition:"all .2s",boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
              <div style={{fontSize:36,marginBottom:10}}>{c.icon}</div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:8,color:"#111827"}}>{c.title}</div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                <span style={{fontSize:12,color:"#9ca3af"}}>⏱ {EXAM_HOURS} ساعة للإنجاز</span>
                <span style={{fontSize:12,color:"#9ca3af"}}>📝 {c.scenarios.length} سيناريو تحليلي</span>
                <span style={{fontSize:12,color:"#059669",fontWeight:600}}>🎯 {c.passMark}% للنجاح</span>
              </div>
              {/* مؤشر السيناريوهات */}
              {(()=>{
                const done=subs.filter(s=>s.studentId===sId&&s.courseId===c.id&&s.status==="scenario_completed").length;
                const inProg=subs.filter(s=>s.studentId===sId&&s.courseId===c.id&&s.status==="in_progress").length;
                const submitted=subs.filter(s=>s.studentId===sId&&s.courseId===c.id&&["submitted","grading","pass","fail"].includes(s.status)).length;
                if(submitted>0) return <div style={{marginTop:8,fontSize:11,color:"#065f46",background:"#d1fae5",borderRadius:6,padding:"4px 8px",textAlign:"center"}}>✓ تم تقديم الاختبار</div>;
                if(done>0||inProg>0) return <div style={{marginTop:8,fontSize:11,color:"#d97706",background:"#fef3c7",borderRadius:6,padding:"4px 8px",textAlign:"center"}}>⏳ جارٍ الاختبار — {done} سيناريو مكتمل</div>;
                return null;
              })()}
              <div style={{marginTop:8,padding:"6px 10px",background:"#EEF2F8",borderRadius:6,fontSize:12,color:"#1B3059",fontWeight:600,textAlign:"center"}}>🔑 يتطلب رمز دخول</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  /* Student login */
  const fieldWrap=(key,label,extra,input)=>(
    <div style={{marginBottom:12}}>
      <label style={{fontSize:13,color:"#374151",display:"block",marginBottom:5,fontWeight:600}}>{label} <span style={{color:"#E8622C"}}>*</span> {extra&&<span style={{color:"#9ca3af",fontWeight:400,fontSize:12}}>{extra}</span>}</label>
      {input}
      {fieldErr[key]&&<div style={{color:"#dc2626",fontSize:11.5,marginTop:5,display:"flex",alignItems:"center",gap:4}}>⚠ {fieldErr[key]}</div>}
    </div>
  );
  const errStyle=key=>fieldErr[key]?{borderColor:"#fca5a5",background:"#FFF8F7"}:{};
  if(screen==="student-login") return(
    <div style={{...base,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
      <div style={{background:"white",border:"1px solid #E7E2D8",borderRadius:18,padding:"2rem",width:420,maxWidth:"100%",boxShadow:"0 6px 26px rgba(16,31,60,0.08)"}}>
        <div style={{textAlign:"center",marginBottom:"1.4rem"}}>
          <img src={LOGO_MARK} alt="" style={{height:64,display:"block",margin:"0 auto 10px"}}/>
          <div style={{fontSize:18,fontWeight:700,color:"#101F3C"}}>تسجيل دخول المتدرب</div>
          <div style={{fontSize:12,color:"#9ca3af",marginTop:4}}>{ORG}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,margin:"0 0 12px"}}>
          <span style={{width:22,height:22,borderRadius:"50%",background:"#1B3059",color:"white",fontSize:12,fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>١</span>
          <span style={{fontSize:13,fontWeight:700,color:"#1B3059"}}>بيانات الهوية</span>
          <span style={{flex:1,height:1,background:"#EFEBE1"}}/>
        </div>
        {fieldWrap("sId","رقم الهوية الوطنية",null,
          <input value={sId} onChange={e=>setSId(e.target.value)} placeholder="1xxxxxxxxx" style={{...inp,...errStyle("sId")}}/>)}
        {fieldWrap("sName","الاسم الثلاثي بالإنجليزية","(كما في الهوية)",
          <input value={sName} onChange={e=>setSName(e.target.value)} placeholder="Mohammed Ahmed Ali" style={{...inp,direction:"ltr",...errStyle("sName")}}/>)}
        {fieldWrap("sBirthdate","تاريخ الميلاد",null,
          <input type="date" value={sBirthdate} onChange={e=>setSBirthdate(e.target.value)} max={new Date().toISOString().split("T")[0]} style={{...inp,direction:"ltr",cursor:"pointer",...errStyle("sBirthdate")}}/>)}
        <div style={{display:"flex",alignItems:"center",gap:8,margin:"16px 0 12px"}}>
          <span style={{width:22,height:22,borderRadius:"50%",background:"#E8622C",color:"white",fontSize:12,fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>٢</span>
          <span style={{fontSize:13,fontWeight:700,color:"#E8622C"}}>التواصل ورقم الطلب</span>
          <span style={{flex:1,height:1,background:"#EFEBE1"}}/>
        </div>
        {fieldWrap("sPhone","رقم الجوال",null,
          <input value={sPhone} onChange={e=>setSPhone(e.target.value)} placeholder="05xxxxxxxx" style={{...inp,direction:"ltr",...errStyle("sPhone")}}/>)}
        {fieldWrap("sOrderNum","رقم الطلب","(الموجود في سلة)",
          <input value={sOrderNum} onChange={e=>setSOrderNum(e.target.value)} placeholder="ORD-XXXXXXXX" style={{...inp,direction:"ltr",...errStyle("sOrderNum")}}/>)}
        <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:10,padding:"9px 12px",margin:"2px 0 12px",fontSize:12,color:"#9A3412"}}>
          ⚠️ بعد اختيار الدورة والبدء يُتاح لك <strong className="num">{EXAM_HOURS} ساعة</strong> لإنهاء الاختبار تلقائياً.
        </div>
        {err&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10,textAlign:"center",background:"#fef2f2",padding:"8px",borderRadius:6}}>{err}</div>}
        <button className="btn-hover" onClick={doLogin} style={{width:"100%",padding:"12px",background:"linear-gradient(135deg,#1B3059,#101F3C)",color:"white",border:"none",borderRadius:10,fontSize:15,cursor:"pointer",fontWeight:700,marginBottom:8,boxShadow:"0 4px 14px rgba(16,31,60,0.25)"}}>دخول ←</button>
        <button onClick={()=>{setScreen("home");setErr("");setFieldErr({});}} style={{width:"100%",padding:"8px",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>← رجوع</button>
      </div>
    </div>
  );

  /* Home */
  return(
    <div style={{...base,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      {/* شريط الهوية العلوي */}
      <div style={{height:6,background:"linear-gradient(90deg,#101F3C 0%,#1B3059 55%,#E8622C 100%)"}}/>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem 1rem"}}>
        <div style={{maxWidth:580,width:"100%",textAlign:"center"}}>
          {/* الشعار الرسمي */}
          <div style={{marginBottom:"1.9rem"}}>
            <img src={LOGO_FULL} alt={ORG} style={{width:185,maxWidth:"58%",display:"block",margin:"0 auto 16px"}}/>
            <div style={{fontSize:16,color:"#1B3059",fontWeight:700,marginBottom:4}}>نظام الاختبارات التحليلية</div>
            <div style={{fontSize:12,color:"#9aa2b1"}}>نمط NEBOSH Open Book — سيناريوهات قائمة على الدور</div>
            <div style={{width:58,height:3,background:"#E8622C",borderRadius:2,margin:"16px auto 0"}}/>
          </div>

          {/* بطاقتا الدخول */}
          <div className="grid-sm-1" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
            <button className="card-hover" onClick={()=>{setScreen("student-login");setErr("");}} style={{background:"white",border:"1.5px solid #E7E2D8",borderRadius:18,padding:"1.8rem 1.25rem",cursor:"pointer",textAlign:"center",boxShadow:"0 3px 14px rgba(16,31,60,0.06)"}}>
              <div style={{width:58,height:58,borderRadius:16,background:"linear-gradient(135deg,#1B3059,#101F3C)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:26}}>👤</div>
              <div style={{fontSize:16,fontWeight:700,marginBottom:4,color:"#101F3C"}}>دخول المتدرب</div>
              <div style={{fontSize:12,color:"#9aa2b1"}}>تقديم الاختبار التحليلي</div>
            </button>
            <button className="card-hover" onClick={()=>{setScreen("trainer-login");setErr("");setTPass("");}} style={{background:"white",border:"1.5px solid #E7E2D8",borderRadius:18,padding:"1.8rem 1.25rem",cursor:"pointer",textAlign:"center",boxShadow:"0 3px 14px rgba(16,31,60,0.06)"}}>
              <div style={{width:58,height:58,borderRadius:16,background:"linear-gradient(135deg,#E8622C,#C94E1D)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:26}}>🏫</div>
              <div style={{fontSize:16,fontWeight:700,marginBottom:4,color:"#101F3C"}}>دخول المدرب</div>
              <div style={{fontSize:12,color:"#9aa2b1"}}>تصحيح النتائج والشهادات</div>
            </button>
          </div>

          {/* شريط الدورات */}
          <div style={{background:"white",border:"1px solid #E7E2D8",borderRadius:16,padding:"1.1rem 1rem",boxShadow:"0 2px 10px rgba(16,31,60,0.05)"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#1B3059",letterSpacing:1,marginBottom:10}}>الدورات المعتمدة</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(96px,1fr))",gap:8}}>
              {courses.map(c=>(
                <div key={c.id} style={{textAlign:"center",padding:"10px 4px",background:"#FBFAF6",border:"1px solid #F0EBDF",borderRadius:12}}>
                  <div style={{width:38,height:38,borderRadius:10,background:"#EEF2F8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,margin:"0 auto 6px"}}>{c.icon}</div>
                  <div style={{fontSize:10.5,color:"#374151",fontWeight:600,lineHeight:1.4}}>{c.title}</div>
                  <div style={{fontSize:9.5,color:"#E8622C",marginTop:3,fontWeight:600}}>🔑 رمز خاص</div>
                </div>
              ))}
            </div>
            <div className="wrap-sm" style={{borderTop:"1px solid #F0EBDF",marginTop:12,paddingTop:11,display:"flex",justifyContent:"center",gap:18}}>
              <span style={{fontSize:12,color:"#6b7280"}}>⏱ <b className="num">{EXAM_HOURS}</b> ساعة لكل اختبار</span>
              <span style={{fontSize:12,color:"#6b7280"}}>📝 سيناريوهات تحليلية</span>
              <span style={{fontSize:12,color:"#6b7280"}}>🏅 شهادة عند النجاح</span>
            </div>
          </div>

          <div style={{marginTop:16,fontSize:11,color:"#C5C0B4",letterSpacing:1.5}}>{ORG_EN.toUpperCase()} © {new Date().getFullYear()}</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
