async function dbLoad(studentId=null){
  try{
    let query=_sb.from("exam_subs").select("data").order("updated_at",{ascending:false});
    // الطالب يحمّل بياناته فقط — المدرب يحمّل الكل
    if(studentId){
      query=_sb.from("exam_subs").select("data").contains("data",{studentId});
    }
    const{data,error}=await query;
    if(error)throw error;
    return(data||[]).map(r=>r.data);
  }catch(e){
    console.error("dbLoad:",e);
    try{const r=localStorage.getItem("itqan_v3_fb");return r?JSON.parse(r):[];}catch{return[];}
  }
}

async function dbUpsert(sub){
  try{
    await _sb.from("exam_subs").upsert({id:sub.id,data:sub,updated_at:new Date().toISOString()});
  }catch(e){
    console.error("dbUpsert:",e);
    // fallback
    try{const all=JSON.parse(localStorage.getItem("itqan_v3_fb")||"[]");const ns=all.filter(s=>s.id!==sub.id);ns.push(sub);localStorage.setItem("itqan_v3_fb",JSON.stringify(ns));}catch{}

}

async function dbGetMeta(key){
  try{const{data}=await _sb.from("exam_meta").select("value").eq("key",key).single();return data?.value||null;}
  catch{return null;}
}

async function dbSetMeta(key,value){
  try{
    const{error}=await _sb.from("exam_meta").upsert({key,value},{onConflict:"key"});
    if(error)throw error;
  }catch(e){
    // احتياط: جرّب التحديث ثم الإدراج إذا لم يكن key مفتاحاً فريداً
    try{
      const{data}=await _sb.from("exam_meta").update({value}).eq("key",key).select();
      if(!data||data.length===0)await _sb.from("exam_meta").insert({key,value});
    }catch(e2){console.error("dbSetMeta:",e2);}
  }
}

async function addNotification(type,data){
  try{
    const notifs=JSON.parse((await dbGetMeta("notifications"))||"[]");
    notifs.unshift({type,data,time:new Date().toISOString(),read:false});
    await dbSetMeta("notifications",JSON.stringify(notifs.slice(0,50)));
  }catch(e){}
}
async function getNotifications(){
  try{return JSON.parse((await dbGetMeta("notifications"))||"[]");}catch{return[];}
}
async function markNotifsRead(){
  try{
    const notifs=await getNotifications();
    await dbSetMeta("notifications",JSON.stringify(notifs.map(n=>({...n,read:true}))));
  }catch(e){}
}

/* 🧹 تعقيم الدورات المحملة من قاعدة البيانات:
   المعرفات المكررة (سيناريو أو مهمة) تسبب اختفاء أزرار المهام وتلخبط الإجابات والتنقل */
function sanitizeCourses(list){
  try{
    const seenCourse=new Set();
    return (list||[]).filter(c=>{
      if(!c||!c.id||seenCourse.has(c.id))return false;
      seenCourse.add(c.id);return true;
    }).map(c=>{
      const seenSc=new Set();
      const scenarios=(c.scenarios||[]).map(sc=>{
        let scId=sc.id||uid2();
        while(seenSc.has(scId))scId=scId+"_"+uid2();
        seenSc.add(scId);
        const seenT=new Set();
        const tasks=(sc.tasks||[]).map(t=>{
          let tid=t.id||uid2();
          while(seenT.has(tid))tid=tid+"_"+uid2();
          seenT.add(tid);
          if(tid!==t.id)console.warn("⚠️ معرف مهمة مكرر أُصلح تلقائياً:",c.title,"/",sc.title);
          return tid===t.id?t:{...t,id:tid};
        });
        return {...sc,id:scId,tasks};
      });
      return {...c,scenarios};
    });
  }catch(e){console.error("sanitizeCourses:",e);return list||[];}
}

async function issueCertificate(sub,course){
  try{
    const certId="CERT-"+serial(sub.id);
    const today=new Date().toISOString().split("T")[0];
    const exp=new Date();
    exp.setFullYear(exp.getFullYear()+(course.certValidityYears||3));
    const expiry=exp.toISOString().split("T")[0];
    // Firestore لا يرفض الكتابة عند انقطاع الشبكة بل يعيد المحاولة للأبد — مهلة 12 ثانية حتى لا يعلق الاعتماد
    const write=window._fbDb.collection("certificates").doc(certId).set({
      name:sub.studentName,
      course:sub.courseTitle,
      date:today,
      expiry:expiry,
      hours:course.hours||"—",
      trainer:course.trainer||"مركز صلة الإتقان للتدريب",
      studentId:sub.studentId,
      studentOrderNum:sub.studentOrderNum||"",
      phone:sub.studentPhone||"",
      certId:certId,
      issuedAt:new Date().toISOString()
    });
    await Promise.race([write,new Promise((_,rej)=>setTimeout(()=>rej(new Error("انتهت مهلة الاتصال بـ Firebase")),12000))]);
    return certId;
  }catch(e){console.error("issueCertificate:",e);return null;}
}

const fmt=iso=>iso?new Date(iso).toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{year:"numeric",month:"long",day:"numeric"}):"—";
const fmtFull=iso=>iso?new Date(iso).toLocaleString("ar-SA-u-ca-gregory-nu-latn",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const serial=id=>id.slice(-8).toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,10);
const wordCount=txt=>txt?txt.trim().split(/\s+/).filter(Boolean).length:0;

function getDeadline(sub){
  if(!sub?.startTime)return null;
  const hours=(sub.examHours||EXAM_HOURS)+(sub.extensionHours||0);
  return new Date(new Date(sub.startTime).getTime()+hours*3600000);
}
function isExpired(sub){return sub?.startTime?getDeadline(sub)<new Date():false;}
function timeLeft(sub){
  const d=getDeadline(sub);if(!d)return null;
  const diff=d-new Date();
  if(diff<=0)return{h:0,m:0,s:0,expired:true};
  return{h:Math.floor(diff/3600000),m:Math.floor((diff%3600000)/60000),s:Math.floor((diff%60000)/1000),expired:false};
}

/* ═══════════════════════════════════════════════
   ⏱️  عداد الوقت
═══════════════════════════════════════════════ */
function TimerBadge({sub}){
  const[t,setT]=useState(()=>timeLeft(sub));
  useEffect(()=>{const i=setInterval(()=>setT(timeLeft(sub)),1000);return()=>clearInterval(i);},[sub?.startTime,sub?.extensionHours]);
  if(!t)return null;
  const color=t.expired?"#dc2626":t.h<2?"#d97706":"#059669";
  const txt=t.expired?"انتهى الوقت":`${String(t.h).padStart(2,"0")}:${String(t.m).padStart(2,"0")}:${String(t.s).padStart(2,"0")}`;
  return <span style={{background:color,color:"white",borderRadius:8,padding:"4px 12px",fontSize:13,fontFamily:"monospace",fontWeight:600,letterSpacing:1}}>{txt}</span>;
}

            {[["📅","تاريخ الإصدار",fmt(sub.reviewedAt)],["🎯","الدرجة المحققة",`${sub.totalScore||0}/${sub.maxScore||100}`],["🔖","رقم الشهادة",serial(sub.id)]].map(([ic,l,v],i)=>(

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:50,paddingTop:"1.5rem",borderTop:"0.5px solid #e5e7eb",marginBottom:"1rem"}}>

              <div key={i} style={{textAlign:"center"}}>
                <div style={{height:44,borderBottom:"1.5px solid #374151",marginBottom:6}}/>
                <div style={{fontSize:12,color:"#6b7280"}}>{s}</div>

            ))}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:11,color:"#9ca3af"}}>
              التحقق: <a href={`https://verify.silatalitqan.com/cert/CERT-${serial(sub.id)}`} target="_blank" style={{color:"#1a5f4a"}}>verify.silatalitqan.com/cert/CERT-{serial(sub.id)}</a>
            </div>
            <div style={{background:"#1a5f4a",color:"white",borderRadius:6,padding:"4px 12px",fontSize:12,fontFamily:"monospace",letterSpacing:1}}>{serial(sub.id)}</div>

/* ═══════════════════════════════════════════════
   📚  إدارة الدورات — بناء وتعديل
═══════════════════════════════════════════════ */
const uid2=()=>Math.random().toString(36).slice(2,8);

function CourseBuilder({courses,onSave,onBack}){
  const[view,setView]=useState("list"); // list | edit
  const[editing,setEditing]=useState(null);
  const[saving,setSaving]=useState(false);
  const emptyTask=()=>({id:uid2(),num:1,text:"",marks:25,criteria:""});
  const emptyScenario=()=>({id:uid2(),title:"",role:"",roleDesc:"",context:"",tasks:[emptyTask()]});
  const emptyCourse=()=>({id:uid2(),title:"",icon:"📋",passMark:60,scenarios:[emptyScenario()]});

  const startNew=()=>{setEditing({...JSON.parse(JSON.stringify(emptyCourse())),accessCode:""});setView("edit");};
  const startEdit=c=>{setEditing({...JSON.parse(JSON.stringify(c)),accessCode:COURSE_CODES[c.id]||""});setView("edit");};

  const updField=(path,val)=>setEditing(prev=>{
    const d=JSON.parse(JSON.stringify(prev));
    const keys=path.split(".");
    let o=d;for(let i=0;i<keys.length-1;i++)o=o[keys[i]];
    o[keys[keys.length-1]]=val;
    return d;
  });

  const addScenario=()=>setEditing(prev=>{const d=JSON.parse(JSON.stringify(prev));d.scenarios.push(emptyScenario());return d;});
  const removeScenario=idx=>setEditing(prev=>{const d=JSON.parse(JSON.stringify(prev));d.scenarios.splice(idx,1);return d;});
  const addTask=sIdx=>setEditing(prev=>{const d=JSON.parse(JSON.stringify(prev));const t=emptyTask();t.num=d.scenarios[sIdx].tasks.length+1;d.scenarios[sIdx].tasks.push(t);return d;});
  const removeTask=(sIdx,tIdx)=>setEditing(prev=>{const d=JSON.parse(JSON.stringify(prev));d.scenarios[sIdx].tasks.splice(tIdx,1);d.scenarios[sIdx].tasks.forEach((t,i)=>t.num=i+1);return d;});

  const doSave=async()=>{
    if(!editing.title.trim()){alert("يرجى إدخال اسم الدورة");return;}
    const code=(editing.accessCode||"").trim().toUpperCase();
    // بدون رمز دخول لا يستطيع أي متدرب فتح الدورة — إلزامي
    if(!code&&!COURSE_CODES[editing.id]){alert("يرجى تحديد رمز دخول للدورة — بدونه لا يستطيع المتدربون الدخول إليها");return;}
    setSaving(true);
    if(code&&code!==COURSE_CODES[editing.id]){
      COURSE_CODES[editing.id]=code;
      await dbSetMeta("course_codes",JSON.stringify(COURSE_CODES));
    }
    const{accessCode,...courseData}=editing; // الرمز يُخزَّن في exam_meta وليس داخل بيانات الدورة
    await dbSaveCourse(courseData);
    const exists=courses.find(c=>c.id===courseData.id);
    const updated=exists?courses.map(c=>c.id===courseData.id?courseData:c):[...courses,courseData];
    onSave(updated);
    setSaving(false);setView("list");
  };

  const doDelete=async(id)=>{
    if(!confirm("هل أنت متأكد من حذف هذه الدورة؟"))return;
    await dbDeleteCourse(id);
    // سجّل الحذف حتى لا تعود الدورة الافتراضية بعد تحديث الصفحة
    try{
      const raw=await dbGetMeta("deleted_courses");
      const arr=raw?JSON.parse(raw):[];
      if(!arr.includes(id)){arr.push(id);await dbSetMeta("deleted_courses",JSON.stringify(arr));}
    }catch(e){}
    // احذف رمز الدخول المرتبط بها
    try{
      if(COURSE_CODES[id]){delete COURSE_CODES[id];await dbSetMeta("course_codes",JSON.stringify(COURSE_CODES));}
    }catch(e){}
    onSave(courses.filter(c=>c.id!==id));
  };

  const inp={width:"100%",padding:"9px 12px",border:"0.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",fontFamily:"inherit"};
  const ta={...inp,minHeight:80,resize:"vertical"};

  if(view==="list") return(
    <div dir="rtl" style={{maxWidth:860,margin:"0 auto",padding:"0 0 2rem"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontSize:17,fontWeight:700}}>إدارة الدورات والأسئلة</div>
          <div style={{fontSize:12,color:"#9ca3af"}}>{courses.length} دورة — يمكنك التعديل والإضافة والحذف</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onBack} style={{padding:"8px 16px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13}}>← رجوع</button>
          <button onClick={startNew} style={{padding:"8px 16px",border:"none",borderRadius:8,background:"#1a5f4a",color:"white",cursor:"pointer",fontSize:13,fontWeight:600}}>+ إضافة دورة جديدة</button>
        </div>
      </div>
      {courses.map((c,i)=>(
        <div key={c.id} style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,padding:"1rem 1.25rem",marginBottom:10,display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontSize:28}}>{c.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:600}}>{c.title}</div>
            <div style={{fontSize:12,color:"#9ca3af",marginTop:2}}>
              {c.scenarios.length} سيناريو · {c.scenarios.reduce((a,s)=>a+s.tasks.length,0)} مهمة · نجاح {c.passMark}%
              {COURSE_CODES[c.id]
                ?<span style={{color:"#1a5f4a",fontWeight:600}}> · 🔑 {COURSE_CODES[c.id]}</span>
                :<span style={{color:"#dc2626",fontWeight:600}}> · ⚠️ بلا رمز دخول — عدّل الدورة وحدد رمزاً</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>startEdit(c)} style={{padding:"6px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,fontWeight:500}}>✏️ تعديل</button>
            <button onClick={()=>doDelete(c.id)} style={{padding:"6px 14px",border:"0.5px solid #fecaca",borderRadius:8,background:"#fef2f2",color:"#dc2626",cursor:"pointer",fontSize:13}}>🗑 حذف</button>
          </div>
        </div>
      ))}
    </div>
  );

  // Edit view
  return(
    <div dir="rtl" style={{maxWidth:860,margin:"0 auto",padding:"0 0 4rem"}}>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,position:"sticky",top:0,background:"#f0f4f8",padding:"10px 0",zIndex:10}}>
        <button onClick={()=>setView("list")} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13}}>← رجوع</button>
        <div style={{flex:1,fontSize:16,fontWeight:700}}>{editing.id&&courses.find(c=>c.id===editing.id)?"تعديل دورة":"إضافة دورة جديدة"}</div>
        <button onClick={doSave} disabled={saving} style={{padding:"8px 20px",border:"none",borderRadius:8,background:"#1a5f4a",color:"white",cursor:"pointer",fontSize:14,fontWeight:600}}>{saving?"⏳ جارٍ الحفظ...":"✅ حفظ الدورة"}</button>
      </div>

      {/* معلومات الدورة */}
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,padding:"1.25rem",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:600,color:"#1a5f4a",marginBottom:12}}>معلومات الدورة</div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>اسم الدورة *</label>
            <input style={inp} value={editing.title} onChange={e=>updField("title",e.target.value)} placeholder="مثال: الأوشا المتقدمة"/>
          </div>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>الأيقونة</label>
            <input style={inp} value={editing.icon} onChange={e=>updField("icon",e.target.value)} placeholder="🎓"/>
          </div>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>نسبة النجاح %</label>
            <input style={inp} type="number" min="50" max="100" value={editing.passMark} onChange={e=>updField("passMark",parseInt(e.target.value)||60)}/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>اسم المدرب (يظهر في الشهادة)</label>
            <input style={inp} value={editing.trainer||""} onChange={e=>updField("trainer",e.target.value)} placeholder="اسم المدرب المعتمد"/>
          </div>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>الساعات التدريبية</label>
            <input style={inp} value={editing.hours||""} onChange={e=>updField("hours",e.target.value)} placeholder="30 ساعة"/>
          </div>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>صلاحية الشهادة (سنوات)</label>
            <input style={inp} type="number" min="1" max="10" value={editing.certValidityYears||3} onChange={e=>updField("certValidityYears",parseInt(e.target.value)||3)}/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 2fr",gap:10}}>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>🔑 رمز دخول الدورة <span style={{color:"#dc2626"}}>*</span></label>
            <input style={{...inp,direction:"ltr",textAlign:"center",letterSpacing:2,fontWeight:700}} value={editing.accessCode||""} onChange={e=>updField("accessCode",e.target.value.toUpperCase())} placeholder="COURSE123"/>
          </div>
          <div style={{alignSelf:"end",fontSize:11,color:"#9ca3af",lineHeight:1.7,paddingBottom:6}}>
            هذا الرمز يُعطى للمتدربين لدخول الاختبار — بدونه لا يمكن فتح الدورة. يُحفظ عند حفظ الدورة.
          </div>
        </div>
      </div>

      {/* السيناريوهات */}
      {editing.scenarios.map((sc,sIdx)=>(
        <div key={sc.id} style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,padding:"1.25rem",marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{fontSize:14,fontWeight:700,color:"#1a5f4a"}}>السيناريو {sIdx+1}</div>
            {editing.scenarios.length>1&&<button onClick={()=>removeScenario(sIdx)} style={{padding:"4px 10px",border:"0.5px solid #fecaca",borderRadius:6,background:"#fef2f2",color:"#dc2626",cursor:"pointer",fontSize:12}}>حذف السيناريو</button>}
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div>
              <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>عنوان السيناريو *</label>
              <input style={inp} value={sc.title} onChange={e=>updField(`scenarios.${sIdx}.title`,e.target.value)} placeholder="السيناريو الأول — اسم الموقف"/>
            </div>
            <div>
              <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>الدور المهني</label>
              <input style={inp} value={sc.role} onChange={e=>updField(`scenarios.${sIdx}.role`,e.target.value)} placeholder="مثال: مشرف السلامة"/>
            </div>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>وصف الدور</label>
            <input style={inp} value={sc.roleDesc} onChange={e=>updField(`scenarios.${sIdx}.roleDesc`,e.target.value)} placeholder="أنت مشرف السلامة في شركة..."/>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>نص السيناريو *</label>
            <textarea style={{...ta,minHeight:120}} value={sc.context} onChange={e=>updField(`scenarios.${sIdx}.context`,e.target.value)} placeholder="اكتب السيناريو التفصيلي هنا — الموقف والتحديات والبيئة..."/>
          </div>

          {/* المهام */}
          <div style={{background:"#f8fafc",borderRadius:8,padding:"12px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:13,fontWeight:600}}>المهام ({sc.tasks.length})</div>
              <button onClick={()=>addTask(sIdx)} style={{padding:"5px 12px",border:"none",borderRadius:6,background:"#1a5f4a",color:"white",cursor:"pointer",fontSize:12,fontWeight:600}}>+ مهمة جديدة</button>
            </div>
            {sc.tasks.map((task,tIdx)=>{
              const dupText=task.text&&task.text.trim()&&editing.scenarios.some((os,osi)=>os.tasks.some(o=>!(osi===sIdx&&o.id===task.id)&&o.text&&o.text.trim()===task.text.trim()));
              return(
              <div key={task.id} style={{background:"white",border:dupText?"1.5px solid #fca5a5":"0.5px solid #e5e7eb",borderRadius:8,padding:"12px",marginBottom:8}}>
                {dupText&&<div style={{background:"#fef2f2",border:"0.5px solid #fecaca",color:"#dc2626",borderRadius:6,padding:"5px 10px",fontSize:12,fontWeight:600,marginBottom:8}}>⚠️ نص هذه المهمة مكرر مع مهمة أخرى في الدورة — احذف إحداهما ثم احفظ الدورة</div>}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#1a5f4a"}}>المهمة {task.num}</div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <label style={{fontSize:11,color:"#9ca3af"}}>الدرجة:</label>
                    <input type="number" min="5" max="100" value={task.marks} onChange={e=>updField(`scenarios.${sIdx}.tasks.${tIdx}.marks`,parseInt(e.target.value)||25)} style={{width:60,padding:"4px 8px",border:"0.5px solid #e5e7eb",borderRadius:6,fontSize:13,textAlign:"center"}}/>
                    {sc.tasks.length>1&&<button onClick={()=>removeTask(sIdx,tIdx)} style={{padding:"3px 8px",border:"0.5px solid #fecaca",borderRadius:6,background:"#fef2f2",color:"#dc2626",cursor:"pointer",fontSize:11}}>حذف</button>}
                  </div>
                </div>
                <div style={{marginBottom:8}}>
                  <label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>نص المهمة / السؤال *</label>
                  <textarea style={{...ta,minHeight:70}} value={task.text} onChange={e=>updField(`scenarios.${sIdx}.tasks.${tIdx}.text`,e.target.value)} placeholder="اكتب نص المهمة التحليلية هنا..."/>
                </div>
                <div>
                  <label style={{fontSize:11,color:"#6b7280",display:"block",marginBottom:3}}>معايير التصحيح (للمدرب فقط)</label>
                  <textarea style={{...ta,minHeight:60}} value={task.criteria} onChange={e=>updField(`scenarios.${sIdx}.tasks.${tIdx}.criteria`,e.target.value)} placeholder="اكتب معايير التصحيح والدرجات التفصيلية هنا..."/>
                </div>
              </div>
            );})}
          </div>
        </div>
      ))}

      <button onClick={addScenario} style={{width:"100%",padding:"10px",border:"1.5px dashed #1a5f4a",borderRadius:10,background:"#f0faf6",color:"#1a5f4a",cursor:"pointer",fontSize:14,fontWeight:600,marginBottom:14}}>+ إضافة سيناريو جديد</button>
      <button onClick={doSave} disabled={saving} style={{width:"100%",padding:"12px",border:"none",borderRadius:10,background:"#1a5f4a",color:"white",cursor:"pointer",fontSize:15,fontWeight:700}}>{saving?"⏳ جارٍ الحفظ...":"✅ حفظ الدورة"}</button>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   ✏️  تصحيح الاختبار
═══════════════════════════════════════════════ */
function GradingView({sub,onSave,onBack,courses}){
  const course=(courses||COURSES).find(c=>c.id===sub.courseId);
  // دعم متعدد السيناريوهات
  const allScenarios=sub.isMultiScenario&&sub.completedScenarioIds
    ?sub.completedScenarioIds.map(id=>course?.scenarios.find(s=>s.id===id)).filter(Boolean)
    :[course?.scenarios.find(s=>s.id===sub.scenarioId)].filter(Boolean);
  const allTasks=allScenarios.flatMap(sc=>sc?.tasks||[]);
  const[scores,setScores]=useState(sub.scores||{});
  // اجمع درجات المهام الحالية فقط — تجاهل درجات مهام حُذفت من الدورة بعد التقديم
  const validTaskIds=new Set(allTasks.map(t=>t.id));
  const total=allTasks.length>0
    ?Object.entries(scores).reduce((a,[id,v])=>a+(validTaskIds.has(id)?(v||0):0),0)
    :Object.values(scores).reduce((a,b)=>a+(b||0),0);
  // الدرجة العظمى من المهام الفعلية أولاً — يصحّح تلقائياً السجلات القديمة المتأثرة بخطأ المضاعفة
  const maxScore=allTasks.reduce((a,t)=>a+t.marks,0)||sub.maxScore||100;
  const pct=Math.round((total/maxScore)*100);
  const passing=pct>=(course?.passMark||60);
  return(
    <div dir="rtl" style={{fontFamily:"system-ui,sans-serif",padding:"1rem",maxWidth:900,margin:"0 auto",paddingBottom:"3rem"}}>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,position:"sticky",top:0,background:"#f0f4f8",padding:"10px 0",zIndex:10}}>
        <button onClick={onBack} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13}}>← رجوع</button>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:600}}>{sub.studentName} — تصحيح الاختبار</div>
          <div style={{fontSize:12,color:"#6b7280"}}>{sub.courseTitle} | {sub.scenarioTitle}</div>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>
            هوية: {sub.studentId} {sub.studentBirthdate&&`| م: ${sub.studentBirthdate}`} {sub.studentPhone&&`| جوال: ${sub.studentPhone}`} {sub.studentOrderNum&&`| طلب: ${sub.studentOrderNum}`}
          </div>
        </div>
        <div style={{background:passing?"#d1fae5":"#fee2e2",borderRadius:12,padding:"8px 20px",textAlign:"center"}}>
          <div style={{fontSize:20,fontWeight:700,color:passing?"#065f46":"#991b1b"}}>{pct}%</div>
          <div style={{fontSize:11,color:passing?"#065f46":"#991b1b"}}>{total}/{maxScore}</div>
        </div>
      </div>
      {allScenarios.map((sc,scIdx)=>(
        <div key={sc?.id||scIdx}>
          {allScenarios.length>1&&sc&&(
            <div style={{background:"#1a5f4a",color:"white",padding:"8px 16px",borderRadius:10,fontSize:13,fontWeight:600,marginBottom:8,marginTop:scIdx>0?16:0}}>
              📋 {sc.title}
            </div>
          )}
          {(sc?.tasks||[]).map(task=>(
            <div key={task.id} style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,padding:"1.25rem",marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div style={{fontSize:14,fontWeight:600,color:"#1a5f4a"}}>المهمة {task.num} ({task.marks} درجة)</div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:12,color:"#6b7280"}}>الدرجة:</span>
                  <input type="number" min="0" max={task.marks} value={scores[task.id]??""} onChange={e=>setScores(s=>({...s,[task.id]:Math.min(task.marks,Math.max(0,parseInt(e.target.value)||0))}))} style={{width:65,padding:"5px 8px",border:"0.5px solid #e5e7eb",borderRadius:6,fontSize:15,textAlign:"center",fontWeight:600}}/>
                  <span style={{fontSize:12,color:"#9ca3af"}}>/ {task.marks}</span>
                </div>
              </div>
              <p style={{fontSize:13,color:"#374151",margin:"0 0 10px",lineHeight:1.7,background:"#f8fafc",padding:"8px 12px",borderRadius:8}}>{task.text}</p>
              <div style={{background:"#fffbeb",border:"0.5px solid #fde68a",borderRadius:8,padding:"8px 12px",marginBottom:8}}>
                <div style={{fontSize:11,color:"#92400e",fontWeight:600,marginBottom:4}}>📋 معايير التصحيح (للمدرب فقط)</div>
                <div style={{fontSize:12,color:"#78350f",lineHeight:1.7}}>{task.criteria}</div>
              </div>
              <div style={{background:"#f8fafc",borderRadius:8,padding:"10px 12px"}}>
                <div style={{fontSize:11,color:"#9ca3af",marginBottom:4}}>إجابة المتدرب:</div>
                <div style={{fontSize:13,color:"#374151",lineHeight:1.9,whiteSpace:"pre-wrap",minHeight:60}}>{sub.answers?.[task.id]||<span style={{color:"#d1d5db",fontStyle:"italic"}}>لم يُجب</span>}</div>
              </div>
            </div>
          ))}
        </div>
      ))}
      <div style={{display:"flex",gap:10,marginTop:16,position:"sticky",bottom:0,background:"#f0f4f8",padding:"10px 0"}}>
        <button onClick={()=>onSave(sub.id,scores,total,maxScore,"grading")} style={{flex:1,padding:"11px",border:"0.5px solid #e5e7eb",borderRadius:10,background:"white",cursor:"pointer",fontSize:14}}>💾 حفظ مؤقت</button>
        <button onClick={()=>{
          if(window.confirm(`⚠️ تأكيد الاعتماد\n\nالطالب: ${sub.studentName}\nالنتيجة: ${passing?"ناجح ✓":"راسب ✗"} — ${pct}%\n\nهل أنت متأكد؟`)){
            onSave(sub.id,scores,total,maxScore,passing?"pass":"fail");
          }
        }} style={{flex:2,padding:"11px",border:"none",borderRadius:10,background:passing?"#059669":"#dc2626",color:"white",cursor:"pointer",fontSize:14,fontWeight:600}}>
          {passing?"✓ اعتماد كـ ناجح":"✗ اعتماد كـ راسب"} — {pct}%
        </button>
      </div>
    </div>
  );
}

/* 🔐 إعدادات الأمان */
function SecuritySettings(){
  const[newPass,setNewPass]=useState("");
  const[saving,setSaving]=useState(false);
  const[msg,setMsg]=useState("");
  const[show,setShow]=useState(false);

  const savePass=async()=>{
    if(!newPass||newPass.length<6){setMsg("❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل");return;}
    setSaving(true);
    await dbSetMeta("trainer_code",newPass);
    TRAINER_CODE=newPass;
    setMsg("✅ تم تغيير كلمة المرور بنجاح");
    setNewPass("");setSaving(false);
    setTimeout(()=>setMsg(""),3000);
  };

  return(
    <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,marginBottom:14,overflow:"hidden"}}>
      <button onClick={()=>setShow(!show)} style={{width:"100%",padding:"12px 16px",background:"none",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,fontWeight:600}}>🔐 إعدادات الأمان — تغيير كلمة مرور المدرب</span>
        <span style={{fontSize:12,color:"#9ca3af"}}>{show?"▲":"▼"}</span>
      </button>
      {show&&(
        <div style={{padding:"0 16px 16px",borderTop:"0.5px solid #f3f4f6"}}>
          <div style={{fontSize:12,color:"#6b7280",marginBottom:10,marginTop:10}}>كلمة المرور الحالية محفوظة بأمان في Supabase</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="password" value={newPass} onChange={e=>setNewPass(e.target.value)} placeholder="كلمة مرور جديدة (6+ أحرف)" style={{flex:1,padding:"9px 12px",border:"0.5px solid #e5e7eb",borderRadius:8,fontSize:14}}/>
            <button onClick={savePass} disabled={saving} style={{padding:"9px 16px",border:"none",borderRadius:8,background:"#1a5f4a",color:"white",cursor:"pointer",fontSize:13,fontWeight:600,whiteSpace:"nowrap"}}>{saving?"⏳...":"✓ حفظ"}</button>
          </div>
          {msg&&<div style={{marginTop:8,fontSize:12,color:msg.includes("✅")?"#059669":"#dc2626"}}>{msg}</div>}
        </div>
      )}
    </div>
  );
}

function Dashboard({subs,setSubs,courses,onGrade,onCert,onLogout,onRefresh,onManageCourses,onLoad}){
  const[filter,setFilter]=useState("all");
  const[selCourse,setSelCourse]=useState("all");
  const[searchQ,setSearchQ]=useState("");
  const[ext,setExt]=useState({});
  const[showConfirm,setShowConfirm]=useState(false);
  const[archiving,setArchiving]=useState(false);
  const[lastArchive,setLastArchive]=useState(null);
  const[refreshing,setRefreshing]=useState(false);
  const[notifs,setNotifs]=useState([]);
  const[showNotifs,setShowNotifs]=useState(false);
  const[editSub,setEditSub]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[examHours,setExamHours]=useState(24);
  const[examHoursInput,setExamHoursInput]=useState("24");
  const[savingHours,setSavingHours]=useState(false);

  useEffect(()=>{
    dbGetMeta("last_archive").then(v=>setLastArchive(v));
    dbGetMeta("exam_hours").then(v=>{if(v){setExamHours(parseInt(v));setExamHoursInput(v);EXAM_HOURS=parseInt(v);}});
    getNotifications().then(n=>setNotifs(n));
    if(onLoad)onLoad();
  },[]);

  const saveExamHours=async()=>{
    setSavingHours(true);
    const h=parseInt(examHoursInput)||24;
    await dbSetMeta("exam_hours",String(h));
    setExamHours(h);EXAM_HOURS=h;
    setSavingHours(false);
  };

  const HIDDEN_STATUSES=["reentry_pending","reentry_approved","reentry_used","reentry_rejected","reentry_consumed","scenario_completed"];
  const filtered=subs.filter(s=>{
    if(HIDDEN_STATUSES.includes(s.status))return false;
    if(filter!=="all"&&s.status!==filter)return false;
    if(selCourse!=="all"&&s.courseId!==selCourse)return false;
    if(searchQ.trim()){
      const q=searchQ.trim().toLowerCase();
      return(s.studentName||"").toLowerCase().includes(q)||(s.studentId||"").includes(q)||(s.studentPhone||"").includes(q);
    }
    return true;
  });
  const counts={all:subs.filter(s=>!HIDDEN_STATUSES.includes(s.status)).length,inprog:subs.filter(s=>s.status==="in_progress").length,pending:subs.filter(s=>s.status==="submitted").length,grading:subs.filter(s=>s.status==="grading").length,pass:subs.filter(s=>s.status==="pass").length,fail:subs.filter(s=>s.status==="fail").length,reentry:subs.filter(s=>s.status==="reentry_pending").length};

  /* مؤشر المساحة — Supabase 500MB مجاناً */
  const dataSize=new Blob([JSON.stringify(subs)]).size;
  const MAX=500*1024*1024;
  const pct=Math.min(100,Math.round((dataSize/MAX)*100));
  const usedKB=(dataSize/1024).toFixed(1);
  const mColor=pct>=80?"#dc2626":pct>=60?"#d97706":"#059669";

  const exportExcel=async(courseId,data)=>{
    await window.loadXLSX(); // تحميل XLSX عند الحاجة فقط
    const d=(data||subs).filter(s=>(courseId==="all"||s.courseId===courseId)&&!HIDDEN_STATUSES.includes(s.status));
    if(!d.length){alert("لا توجد بيانات");return false;}
    const month=new Date().toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{year:"numeric",month:"long"});
    const rows=[[`أرشيف اختبارات ${month} — ${ORG}`],[],
      ["الاسم","رقم الهوية","تاريخ الميلاد","رقم الجوال","رقم الطلب","الدورة","السيناريو","الدرجة","النسبة%","الحالة","تاريخ التقديم","تاريخ المراجعة"],
      ...d.map(s=>[s.studentName,s.studentId,s.studentBirthdate||"",s.studentPhone||"",s.studentOrderNum||"",s.courseTitle,s.scenarioTitle||"",s.totalScore??"-",s.maxScore&&s.totalScore!==undefined?Math.round(((s.totalScore||0)/s.maxScore)*100)+"%":"-",s.status==="pass"?"ناجح":s.status==="fail"?"راسب":s.status==="grading"?"قيد التصحيح":s.status==="in_progress"?"جارٍ الاختبار":"انتظار",fmtFull(s.submittedAt),fmtFull(s.reviewedAt)])
    ];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:22},{wch:14},{wch:14},{wch:14},{wch:14},{wch:24},{wch:30},{wch:10},{wch:10},{wch:14},{wch:22},{wch:22}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"النتائج");
    const stats=[["إحصائيات"],[],["الإجمالي",d.length],["ناجح",d.filter(s=>s.status==="pass").length],["راسب",d.filter(s=>s.status==="fail").length],["لم يُصحَّح",d.filter(s=>["submitted","grading"].includes(s.status)).length],["نسبة النجاح",d.filter(s=>["pass","fail"].includes(s.status)).length?Math.round(d.filter(s=>s.status==="pass").length/d.filter(s=>["pass","fail"].includes(s.status)).length*100)+"%":"—"]];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(stats),"إحصائيات");
    try{
      XLSX.writeFile(wb,`أرشيف_${new Date().getFullYear()}_${String(new Date().getMonth()+1).padStart(2,"0")}_صلة_الإتقان.xlsx`);
    }catch(e){console.error("exportExcel:",e);alert("⚠️ تعذّر إنشاء ملف Excel — لم يتم مسح أي بيانات");return false;}
    return true;
  };

  const doArchive=async()=>{
    setArchiving(true);
    const ok=await exportExcel("all",subs);
    if(ok){
      await dbClearAll();
      setSubs([]);
      const now=new Date().toISOString();
      await dbSetMeta("last_archive",now);
      setLastArchive(now);
      setShowConfirm(false);
    }
    setArchiving(false);
  };

  const doExtend=async(subId,hours)=>{
    if(!hours||!(hours>0))return; // منع القيم السالبة أو الصفرية
    const updated=subs.find(s=>s.id===subId);
    if(!updated)return;
    const ns={...updated,extensionHours:(updated.extensionHours||0)+hours};
    await dbUpsert(ns);
    setSubs(prev=>prev.map(s=>s.id===subId?ns:s));
  };

  const doRefresh=async()=>{
    setRefreshing(true);
    await onRefresh();
    setRefreshing(false);
  };

  const badge=s=>{
    const m={in_progress:{bg:"#dbeafe",c:"#1e40af",l:"جارٍ الاختبار"},submitted:{bg:"#fef3c7",c:"#92400e",l:"انتظار التصحيح"},grading:{bg:"#ede9fe",c:"#5b21b6",l:"قيد التصحيح"},pass:{bg:"#d1fae5",c:"#065f46",l:"ناجح ✓"},fail:{bg:"#fee2e2",c:"#991b1b",l:"راسب ✗"},expired:{bg:"#f3f4f6",c:"#6b7280",l:"منتهي الوقت"}};
    const x=m[s]||m.submitted;
    return <span style={{background:x.bg,color:x.c,borderRadius:6,padding:"3px 10px",fontSize:12,fontWeight:600}}>{x.l}</span>;
  };

  return(
    <div dir="rtl" style={{fontFamily:"system-ui,sans-serif",minHeight:"100vh",background:"#f0f4f8",padding:"1rem"}}>
      {showConfirm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
          <div style={{background:"white",borderRadius:16,padding:"2rem",maxWidth:440,width:"90%",textAlign:"center",direction:"rtl"}}>
            <div style={{fontSize:44,marginBottom:12}}>📦</div>
            <div style={{fontSize:18,fontWeight:600,marginBottom:8}}>تأكيد الأرشفة الشهرية</div>
            <div style={{fontSize:14,color:"#6b7280",lineHeight:1.8,marginBottom:16}}>سيتم تنزيل Excel يحتوي على <strong>{subs.length} متدرب</strong> ثم مسح جميع البيانات من النظام لتحرير المساحة.<br/><span style={{color:"#dc2626",fontWeight:600}}>⚠️ تأكد من حفظ الملف قبل الإغلاق</span></div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setShowConfirm(false)} style={{flex:1,padding:"11px",border:"0.5px solid #e5e7eb",borderRadius:10,background:"white",cursor:"pointer",fontSize:14}}>إلغاء</button>
              <button onClick={doArchive} disabled={archiving} style={{flex:2,padding:"11px",border:"none",borderRadius:10,background:"#1a5f4a",color:"white",cursor:"pointer",fontSize:14,fontWeight:600}}>{archiving?"⏳ جارٍ التنزيل...":"✓ تنزيل ومسح البيانات"}</button>
            </div>
          </div>
        </div>
      )}

      {/* modal تعديل بيانات المتدرب */}
      {editSub&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:"1rem"}}>
          <div style={{background:"white",borderRadius:16,padding:"2rem",maxWidth:500,width:"100%",direction:"rtl",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontSize:17,fontWeight:700}}>تعديل بيانات المتدرب</div>
              <button onClick={()=>setEditSub(null)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#9ca3af"}}>✕</button>
            </div>
            {[
              ["studentName","الاسم بالإنجليزية","text","Mohammed Ali"],
              ["studentId","رقم الهوية","text","1xxxxxxxxx"],
              ["studentBirthdate","تاريخ الميلاد","date",""],
              ["studentPhone","رقم الجوال","text","05xxxxxxxx"],
              ["studentOrderNum","رقم الطلب","text","ORD-XXXXXXXX"],
            ].map(([field,label,type,ph])=>(
              <div key={field} style={{marginBottom:12}}>
                <label style={{fontSize:13,color:"#374151",display:"block",marginBottom:4,fontWeight:500}}>{label}</label>
                <input type={type} value={editForm[field]||""} onChange={e=>setEditForm(f=>({...f,[field]:e.target.value}))}
                  placeholder={ph} style={{width:"100%",padding:"9px 12px",border:"0.5px solid #e5e7eb",borderRadius:8,fontSize:14,boxSizing:"border-box",direction:type==="date"?"ltr":field==="studentName"||field==="studentId"||field==="studentPhone"||field==="studentOrderNum"?"ltr":"rtl"}}/>
              </div>

            <div style={{marginBottom:12}}>
              <label style={{fontSize:13,color:"#374151",display:"block",marginBottom:4,fontWeight:500}}>الدورة</label>
              <select value={editForm.courseId||""} onChange={e=>{const c=courses.find(x=>x.id===e.target.value);setEditForm(f=>({...f,courseId:e.target.value,courseTitle:c?.title||f.courseTitle}));}} style={{width:"100%",padding:"9px 12px",border:"0.5px solid #e5e7eb",borderRadius:8,fontSize:14,background:"white"}}>
                {courses.map(c=><option key={c.id} value={c.id}>{c.icon} {c.title}</option>)}
              </select>
            </div>
            <div style={{marginBottom:16}}>
              <label style={{fontSize:13,color:"#374151",display:"block",marginBottom:4,fontWeight:500}}>الحالة</label>
              <select value={editForm.status||""} onChange={e=>setEditForm(f=>({...f,status:e.target.value}))} style={{width:"100%",padding:"9px 12px",border:"0.5px solid #e5e7eb",borderRadius:8,fontSize:14,background:"white"}}>
                <option value="in_progress">جارٍ الاختبار</option>
                <option value="submitted">انتظار التصحيح</option>
                <option value="grading">قيد التصحيح</option>
                <option value="pass">ناجح</option>
                <option value="fail">راسب</option>
              </select>
            </div>
            <div style={{background:"#fef2f2",border:"0.5px solid #fecaca",borderRadius:8,padding:"8px 12px",marginBottom:16,fontSize:12,color:"#991b1b"}}>
              ⚠️ التعديل يُحدَّث مباشرةً في قاعدة البيانات — تأكد من البيانات قبل الحفظ
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setEditSub(null)} style={{flex:1,padding:"10px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:14}}>إلغاء</button>
              <button onClick={async()=>{
                const updated={...editSub,...editForm};
                await dbUpsert(updated);
                setSubs(prev=>prev.map(s=>s.id===updated.id?updated:s));
                setEditSub(null);
              }} style={{flex:2,padding:"10px",border:"none",borderRadius:8,background:"#1a5f4a",color:"white",cursor:"pointer",fontSize:14,fontWeight:600}}>💾 حفظ التعديلات</button>
            </div>
          </div>
        </div>
      )}
      <div style={{maxWidth:1080,margin:"0 auto"}}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{fontSize:20,fontWeight:700,color:"#111827"}}>{ORG}</div>
            <div style={{fontSize:13,color:"#6b7280"}}>لوحة تحكم المدرب — الاختبارات التحليلية</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {/* 🔔 جرس الإشعارات */}
            <div style={{position:"relative"}}>
              <button onClick={async()=>{setShowNotifs(!showNotifs);if(!showNotifs){await markNotifsRead();setNotifs(prev=>prev.map(n=>({...n,read:true})));}}} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,position:"relative"}}>
                🔔 {notifs.filter(n=>!n.read).length>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#dc2626",color:"white",borderRadius:"50%",width:18,height:18,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>{notifs.filter(n=>!n.read).length}</span>}
              </button>
              {showNotifs&&(
                <div style={{position:"absolute",left:0,top:"110%",width:320,background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,boxShadow:"0 8px 24px rgba(0,0,0,0.12)",zIndex:50,maxHeight:400,overflowY:"auto",direction:"rtl"}}>
                  <div style={{padding:"10px 14px",borderBottom:"0.5px solid #f3f4f6",fontSize:13,fontWeight:600}}>الإشعارات</div>
                  {notifs.length===0&&<div style={{padding:"20px",textAlign:"center",color:"#9ca3af",fontSize:13}}>لا توجد إشعارات</div>}
                  {notifs.map((n,i)=>(
                    <div key={i} style={{padding:"10px 14px",borderBottom:"0.5px solid #f9fafb",background:n.read?"white":"#f0faf6"}}>
                      <div style={{fontSize:12,fontWeight:600,color:"#1a5f4a"}}>
                        {n.type==="new_submission"?"📝 اختبار جديد":n.type==="edit_request"?"✏️ طلب فتح تعديل":"🔄 طلب إعادة دخول"}
                      </div>

            <button onClick={onLogout} style={{padding:"7px 14px",border:"0.5px solid #e5e7eb",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,color:"#6b7280"}}>خروج</button>
          </div>
        </div>

        {/* مؤشر المساحة */}
        <div style={{background:"white",border:`1px solid ${pct>=80?"#fecaca":"#e5e7eb"}`,borderRadius:12,padding:"1rem 1.25rem",marginBottom:14,display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:220}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:13,fontWeight:600,color:pct>=80?"#dc2626":"#374151"}}>{pct>=80?"⚠️ المساحة على وشك الامتلاء!":"☁️ Supabase — المساحة المستخدمة"}</span>

            </div>
            <div style={{height:10,background:"#f3f4f6",borderRadius:5,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:mColor,borderRadius:5,transition:"width .5s"}}/>
            </div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:4}}>Supabase مجاني — يكفي لـ آلاف المتدربين ✅</div>
          </div>

            <span style={{fontSize:13,color:"#6b7280"}}>ساعة</span>

            {courses.map(c=>{

            {subs.filter(s=>s.status==="reentry_pending").map(req=>(

                  <button onClick={async()=>{await dbUpsert({...req,status:"reentry_rejected",rejectedAt:new Date().toISOString()});const d=await dbLoad();setSubs(d);}} style={{padding:"6px 14px",border:"none",borderRadius:8,background:"#dc2626",color:"white",cursor:"pointer",fontSize:13,fontWeight:600}}>✗ رفض</button>

        {/* ✏️ طلبات فتح الاختبار للتعديل */}
        {subs.filter(s=>s.editRequest?.status==="pending"&&s.status==="submitted").length>0&&(
          <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:12,padding:"1rem 1.25rem",marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:600,color:"#92400e",marginBottom:10}}>✏️ طلبات فتح الاختبار للتعديل ({subs.filter(s=>s.editRequest?.status==="pending"&&s.status==="submitted").length})</div>
            {subs.filter(s=>s.editRequest?.status==="pending"&&s.status==="submitted").map(req=>(
              <div key={req.id} style={{background:"white",borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{req.studentName} <span style={{fontSize:12,color:"#9ca3af"}}>({req.studentId})</span></div>
                  <div style={{fontSize:12,color:"#6b7280"}}>{req.courseTitle} | جوال: {req.studentPhone||"—"}</div>
                  <div style={{fontSize:11,color:"#9ca3af"}}>طُلب: {fmtFull(req.editRequest?.at)} · {isExpired(req)?"⚠️ وقته منتهٍ — مدّد له بعد الموافقة":"وقت الاختبار ما زال جارياً"}</div>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={async()=>{const upd={...req,status:"in_progress",editRequest:{status:"approved",at:new Date().toISOString()}};await dbUpsert(upd);setSubs(prev=>prev.map(s=>s.id===upd.id?upd:s));}} style={{padding:"6px 14px",border:"none",borderRadius:8,background:"#059669",color:"white",cursor:"pointer",fontSize:13,fontWeight:600}}>✓ موافقة وفتح الاختبار</button>
                  <button onClick={async()=>{const upd={...req,editRequest:{status:"rejected",at:new Date().toISOString()}};await dbUpsert(upd);setSubs(prev=>prev.map(s=>s.id===upd.id?upd:s));}} style={{padding:"6px 14px",border:"none",borderRadius:8,background:"#dc2626",color:"white",cursor:"pointer",fontSize:13,fontWeight:600}}>✗ رفض</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {filtered.length===0
          ?<div style={{textAlign:"center",padding:"3rem",color:"#9ca3af",background:"white",borderRadius:12,border:"0.5px solid #e5e7eb"}}>لا توجد نتائج بعد</div>
          :<div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:12,overflow:"hidden"}}>
            {filtered.map((sub,idx)=>{
              const expired=isExpired(sub)&&sub.status==="in_progress";
              return(
                <div key={sub.id} style={{padding:"1rem 1.25rem",borderBottom:idx<filtered.length-1?"0.5px solid #f3f4f6":"none"}}>
                  <div style={{display:"grid",gridTemplateColumns:"1.5fr 1.2fr 0.8fr auto",gap:10,alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:15}}>{sub.studentName} <span style={{fontSize:12,color:"#9ca3af",fontWeight:400}}>({sub.studentId})</span></div>
                      <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{sub.courseTitle}</div>
                      <div style={{fontSize:11,color:"#9ca3af"}}>{sub.scenarioTitle}</div>
                      {sub.studentBirthdate&&<div style={{fontSize:11,color:"#9ca3af"}}>م: {sub.studentBirthdate} {sub.studentPhone&&`| 📱 ${sub.studentPhone}`} {sub.studentOrderNum&&`| طلب: ${sub.studentOrderNum}`}</div>}
                    </div>
                    <div>
                      <div style={{fontSize:12,color:"#6b7280",marginBottom:4}}>{sub.totalScore!==undefined&&sub.maxScore?`${sub.totalScore}/${sub.maxScore} (${Math.round((sub.totalScore/sub.maxScore)*100)}%)`:"لم يُصحَّح بعد"}</div>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        {badge(expired?"expired":sub.status)}
                        {sub.status==="in_progress"&&<TimerBadge sub={sub}/>}
                      </div>
                      <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{fmtFull(sub.submittedAt)}</div>
                    </div>
                    <div style={{textAlign:"center"}}>
                      {sub.status==="in_progress"&&(
                        <div style={{display:"flex",alignItems:"center",gap:4,justifyContent:"center",flexWrap:"wrap"}}>
                          <input type="number" min="1" max="72" value={ext[sub.id]||""} onChange={e=>setExt(x=>({...x,[sub.id]:e.target.value}))} placeholder="ساعات" style={{width:55,padding:"4px 6px",border:"0.5px solid #e5e7eb",borderRadius:6,fontSize:12,textAlign:"center"}}/>
                          <button onClick={()=>{if(ext[sub.id])doExtend(sub.id,parseInt(ext[sub.id]));}} style={{padding:"4px 10px",border:"none",borderRadius:6,background:"#f0a500",color:"white",cursor:"pointer",fontSize:11,fontWeight:600}}>تمديد</button>
                        </div>
                      )}
                    </div>
                    <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                      {(sub.status==="submitted"||sub.status==="grading")&&<button onClick={()=>onGrade(sub)} style={{padding:"6px 14px",borderRadius:8,border:"none",background:"#7c3aed",color:"white",cursor:"pointer",fontSize:12,fontWeight:600}}>تصحيح</button>}
                      {sub.status==="pass"&&<button onClick={()=>onCert(sub)} style={{padding:"6px 14px",borderRadius:8,border:"none",background:"#f0a500",color:"white",cursor:"pointer",fontSize:12,fontWeight:600}}>🏅 شهادة</button>}
                      {sub.status==="fail"&&<button onClick={()=>onGrade(sub)} style={{padding:"6px 10px",borderRadius:8,border:"0.5px solid #e5e7eb",background:"white",cursor:"pointer",fontSize:12,color:"#6b7280"}}>مراجعة</button>}
                      <button onClick={()=>{setEditSub(sub);setEditForm({studentName:sub.studentName,studentId:sub.studentId,studentBirthdate:sub.studentBirthdate||"",studentPhone:sub.studentPhone||"",studentOrderNum:sub.studentOrderNum||"",courseId:sub.courseId,courseTitle:sub.courseTitle,status:sub.status});}} style={{padding:"6px 10px",borderRadius:8,border:"0.5px solid #e5e7eb",background:"white",cursor:"pointer",fontSize:12,color:"#374151"}}>✏️</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        }
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   📝  واجهة الاختبار
═══════════════════════════════════════════════ */
function ExamView({sub,setSubs,subs,onSubmit,onNextScenario,courses,setActiveSub}){
  const course=(courses||COURSES).find(c=>c.id===sub.courseId);
  const scenario=course?.scenarios.find(s=>s.id===sub.scenarioId);
  const[answers,setAnswers]=useState(sub.answers||{});
  const[taskIdx,setTaskIdx]=useState(0);
  const[expanded,setExpanded]=useState(true);
  const[saved,setSaved]=useState(false);
  const[justExpired,setJustExpired]=useState(false);
  const[showNextScenario,setShowNextScenario]=useState(false);
  const expired=isExpired(sub);

  // هل يوجد سيناريو تالٍ؟
  const currentScenarioIdx=course?.scenarios.findIndex(s=>s.id===sub.scenarioId)??0;
  const nextScenario=course?.scenarios[currentScenarioIdx+1]||null;
  const isLastScenario=!nextScenario;

  // ── Polling — تحقق من التمديد كل 60 ثانية ──────────────
  useEffect(()=>{
    if(expired)return;
    const poll=setInterval(async()=>{
      try{
        const fresh=await _sb.from("exam_subs").select("data").eq("id",sub.id).single();
        if(fresh?.data?.data){
          const updated=fresh.data.data;
          // إذا تغيّر extensionHours أو startTime — حدّث الـ activeSub
          if(updated.extensionHours!==sub.extensionHours||updated.startTime!==sub.startTime){
            setSubs(prev=>prev.map(s=>s.id===sub.id?updated:s));
            setActiveSub(updated);
          }
        }
      }catch(e){}
    },60*1000); // كل دقيقة
    return()=>clearInterval(poll);
  },[sub.id,sub.extensionHours,expired]);

  // ⏲ تحديث دوري لحالة انتهاء الوقت — تظهر شاشة الانتهاء دون الحاجة لأي كتابة
  const[,setTick]=useState(0);
  useEffect(()=>{
    const t=setInterval(()=>setTick(x=>x+1),15*1000);
    return()=>clearInterval(t);
  },[]);

  // ⏰ بعد انتهاء الوقت: تحقق تلقائياً من التمديد كل 30 ثانية وأعد فتح الاختبار فوراً
  useEffect(()=>{
    if(!expired)return;
    const poll=setInterval(async()=>{
      try{
        const{data}=await _sb.from("exam_subs").select("data").eq("id",sub.id).single();
        if(data?.data&&!isExpired(data.data)){
          clearInterval(poll);
          setSubs(prev=>prev.map(s=>s.id===sub.id?data.data:s));
          if(setActiveSub)setActiveSub(data.data);
        }
      }catch(e){}
    },30*1000);
    return()=>clearInterval(poll);
  },[expired,sub.id]);

  // Auto-save كل 3 دقائق بصمت — عبر refs حتى لا يُعاد ضبط المؤقت مع كل حرف
  const answersRef=useRef(answers);
  useEffect(()=>{answersRef.current=answers;},[answers]);
  const subRef=useRef(sub);
  useEffect(()=>{subRef.current=sub;},[sub]);
  useEffect(()=>{
    if(expired)return;
    const interval=setInterval(async()=>{
      const updated={...subRef.current,answers:answersRef.current,autoSavedAt:new Date().toISOString()};
      await dbUpsert(updated);
      setSubs(prev=>prev.map(s=>s.id===updated.id?updated:s));
    },3*60*1000);
    return()=>clearInterval(interval);
  },[sub.id,expired]);

  // حفظ عند إغلاق أو تحديث الصفحة
  useEffect(()=>{
    const handleUnload=()=>{
      if(!expired&&answers&&Object.keys(answers).length>0){
        const updated={...sub,answers,autoSavedAt:new Date().toISOString()};
        // إرسال فعلي لقاعدة البيانات عند الإغلاق — fetch keepalive يستمر بعد إغلاق الصفحة
        try{
          fetch(`${SUPABASE_URL}/rest/v1/exam_subs?on_conflict=id`,{
            method:"POST",keepalive:true,
            headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Prefer":"resolution=merge-duplicates"},
            body:JSON.stringify({id:updated.id,data:updated,updated_at:new Date().toISOString()})
          }).catch(()=>{});
        }catch(e){}
        // حفظ احتياطي في localStorage
        try{const all=JSON.parse(localStorage.getItem("itqan_v3_fb")||"[]");const ns=all.filter(s=>s.id!==updated.id);ns.push(updated);localStorage.setItem("itqan_v3_fb",JSON.stringify(ns));}catch{}
      }
    };
    window.addEventListener("beforeunload",handleUnload);
    return()=>window.removeEventListener("beforeunload",handleUnload);
  },[answers,expired,sub]);

  // تحذير عند محاولة إغلاق الصفحة
  useEffect(()=>{
    const handleBeforeUnload=(e)=>{
      if(!expired){
        e.preventDefault();
        e.returnValue="إجاباتك محفوظة — هل تريد مغادرة صفحة الاختبار؟";
        return e.returnValue;
      }
    };
    window.addEventListener("beforeunload",handleBeforeUnload);
    return()=>window.removeEventListener("beforeunload",handleBeforeUnload);
  },[expired]);

  // Auto-save عند انتهاء الوقت
  useEffect(()=>{
    if(!expired)return;
    const autoSave=async()=>{
      const updated={...sub,answers,autoSavedOnExpiry:true};
      await dbUpsert(updated);
      setJustExpired(true);
    };
    autoSave();
  },[expired]);

  if(!scenario)return <div style={{padding:"2rem",textAlign:"center",color:"#dc2626"}}>خطأ: السيناريو غير موجود</div>;

  const task=scenario.tasks[taskIdx]||scenario.tasks[0];
  if(!task)return <div style={{padding:"2rem",textAlign:"center",color:"#dc2626"}}>خطأ في تحميل المهمة</div>;
  const allAnswered=scenario.tasks.every(t=>(answers[t.id]||"").trim().length>50);

  const saveDraft=async()=>{
    const updated={...sub,answers};
    await dbUpsert(updated);
    setSubs(prev=>prev.map(s=>s.id===sub.id?updated:s));
    setSaved(true);setTimeout(()=>setSaved(false),2000);
    return updated;
  };

  // ↩ الرجوع لسيناريو سابق مكتمل (ضمن نفس نافذة الوقت فقط — startTime يميّز المحاولة الحالية عن محاولات قديمة)
  const sameAttempt=s=>s.studentId===sub.studentId&&s.courseId===sub.courseId&&s.startTime===sub.startTime&&s.status==="scenario_completed";
  const hasPrevScenario=currentScenarioIdx>0&&subs.some(s=>s.id!==sub.id&&sameAttempt(s));
  const goPrevScenario=async()=>{
    const prevSc=[...(course?.scenarios||[])].slice(0,currentScenarioIdx).reverse().find(scn=>subs.some(s=>sameAttempt(s)&&s.scenarioId===scn.id));
    if(!prevSc)return;
    const target=subs.find(s=>sameAttempt(s)&&s.scenarioId===prevSc.id);
    if(!target)return;
    const savedCur={...sub,answers,status:"scenario_completed"};
    const reopened={...target,status:"in_progress"};
    await dbUpsert(savedCur);
    await dbUpsert(reopened);
    setSubs(prev=>prev.map(s=>s.id===savedCur.id?savedCur:s.id===reopened.id?reopened:s));
    onNextScenario(reopened);
  };

  if(expired)return(
    <div dir="rtl" style={{fontFamily:"system-ui,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#f0f4f8"}}>
      <div style={{background:"white",border:"0.5px solid #e5e7eb",borderRadius:16,padding:"2.5rem",maxWidth:460,textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:52,marginBottom:14}}>⏰</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8,color:"#d97706"}}>انتهى وقت الاختبار</div>
